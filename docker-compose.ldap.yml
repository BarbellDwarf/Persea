# Local LDAP test harness for tests/ldap_integration.rs (persea#154).
#
# Start it with:
#   docker compose -f docker-compose.ldap.yml up -d --wait
# then run the integration tests against it:
#   TEST_LDAP_URL=ldap://127.0.0.1:3389 cargo test --test ldap_integration
#
# The seed LDIF is mounted into the osixia bootstrap custom directory, so the
# users (alice, bob) and the engineers group exist as soon as the container
# is healthy. The health check verifies the seed actually loaded, and --wait
# blocks until it passes.
services:
  ldap:
    image: osixia/openldap:1.5.0
    container_name: persea-ldap-test
    environment:
      LDAP_ORGANISATION: Example
      LDAP_DOMAIN: example.com
      LDAP_ADMIN_PASSWORD: admin
    ports:
      - "3389:389"
    volumes:
      - ./tests/fixtures/ldap-seed.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/50-seed.ldif:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "ldapsearch -x -H ldap://localhost:389 -b dc=example,dc=com -D cn=admin,dc=example,dc=com -w admin '(objectClass=*)' | grep -q uid=alice",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
