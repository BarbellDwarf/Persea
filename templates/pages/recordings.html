{% extends "layouts/app.html" %}

{% block title %}{{ site_title }} — Recordings{% endblock %}

{% block content %}
<div class="max-w-7xl mx-auto">
    <div class="flex items-center justify-between mb-6">
        <div>
            <h1 class="text-2xl font-bold text-gray-100">Recordings</h1>
            <p class="text-sm text-gray-500 mt-1">Session recordings and audit playback</p>
        </div>
        <div class="flex items-center gap-3">
            <input type="search" id="recordings-search" placeholder="Search recordings..."
                class="form-input w-64">
        </div>
    </div>

    <div id="recordings-empty" class="hidden text-center py-16">
        <svg class="mx-auto h-12 w-12 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/>
        </svg>
        <h3 class="mt-3 text-lg font-medium text-gray-400">No recordings</h3>
        <p class="mt-1 text-sm text-gray-500">No session recordings found.</p>
    </div>

    <div id="recordings-content" class="hidden">
        <div class="card table-wrapper">
            <table class="w-full">
                <thead>
                    <tr class="border-b border-gray-800 text-left text-xs text-gray-500 uppercase tracking-wider">
                        <th>Name</th>
                        <th>Protocol</th>
                        <th>User</th>
                        <th>Duration</th>
                        <th>Date</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="recordings-list" class="divide-y divide-gray-800"></tbody>
            </table>
        </div>
    </div>

    <!-- Player modal -->
    <div id="player-section" class="hidden fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-6">
        <div class="bg-gray-900 border border-gray-800 rounded-xl w-full max-w-6xl max-h-[90vh] flex flex-col">
            <div class="flex items-center justify-between px-4 py-3 border-b border-gray-800">
                <span id="player-title" class="text-sm font-medium text-gray-300">Playback</span>
                <button id="player-close" class="btn btn-sm text-gray-400 hover:text-gray-200 p-1" aria-label="Close player">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            <div id="player-display" class="flex-1 bg-black m-2 rounded overflow-auto" style="min-height:400px"></div>
            <div id="player-controls" class="flex items-center gap-3 px-4 py-3 border-t border-gray-800">
                <button id="player-play" class="px-4 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded text-sm font-medium transition-colors">Play</button>
                <button id="player-pause" class="hidden px-4 py-1.5 bg-gray-800 hover:bg-gray-700 border border-gray-700 text-gray-300 rounded text-sm transition-colors">Pause</button>
                <div class="flex-1"></div>
                <span id="player-time" class="text-xs text-gray-500">0:00</span>
            </div>
        </div>
    </div>
</div>

<script>
(function() {
    var searchInput = document.getElementById('recordings-search');
    var searchTimer = null;

    function loadRecordings(query) {
        var url = '/api/recordings';
        if (query) url += '?q=' + encodeURIComponent(query);
        fetch(url, { credentials: 'same-origin' })
            .then(function(r) { return r.ok ? r.json() : []; })
            .then(function(data) {
                var list = document.getElementById('recordings-list');
                var empty = document.getElementById('recordings-empty');
                var content = document.getElementById('recordings-content');
                var items = Array.isArray(data) ? data : (data.recordings || []);
                if (items.length === 0) {
                    empty.classList.remove('hidden');
                    content.classList.add('hidden');
                    return;
                }
                empty.classList.add('hidden');
                content.classList.remove('hidden');
                list.innerHTML = items.map(function(rec) {
                    var name = rec.name || rec.filename || 'Unknown';
                    var protocol = (rec.protocol || '').toUpperCase();
                    var user = rec.user || rec.created_by || '—';
                    var duration = rec.duration || '—';
                    var date = rec.date || rec.created_at || '—';
                    var protoColors = {
                        SSH: 'bg-green-900/50 text-green-300 border-green-800',
                        RDP: 'bg-blue-900/50 text-blue-300 border-blue-800',
                        VNC: 'bg-orange-900/50 text-orange-300 border-orange-800',
                        SPICE: 'bg-purple-900/50 text-purple-300 border-purple-800',
                        WEB: 'bg-teal-900/50 text-teal-300 border-teal-800',
                    };
                    var colorClass = protoColors[protocol] || 'bg-gray-800 text-gray-400 border-gray-700';
                    return '<tr class="hover:bg-gray-800/50 transition-colors">' +
                        '<td class="px-4 py-3 text-sm text-gray-200">' + escapeHtml(name) + '</td>' +
                        '<td class="px-4 py-3"><span class="px-2 py-0.5 text-xs font-medium rounded border ' + colorClass + '">' + escapeHtml(protocol) + '</span></td>' +
                        '<td class="px-4 py-3 text-sm text-gray-400">' + escapeHtml(user) + '</td>' +
                        '<td class="px-4 py-3 text-sm text-gray-400">' + escapeHtml(String(duration)) + '</td>' +
                        '<td class="px-4 py-3 text-sm text-gray-500">' + escapeHtml(String(date)) + '</td>' +
                        '<td class="px-4 py-3 text-right">' +
                            '<button onclick="playRecording(\'' + escapeHtml(name) + '\')" class="text-emerald-400 hover:text-emerald-300 text-sm mr-3">Play</button>' +
                            '<button onclick="deleteRecording(\'' + escapeHtml(name) + '\')" class="text-red-400 hover:text-red-300 text-sm">Delete</button>' +
                        '</td>' +
                        '</tr>';
                }).join('');
            })
            .catch(function() {});
    }

    window.playRecording = function(name) {
        var section = document.getElementById('player-section');
        var title = document.getElementById('player-title');
        var display = document.getElementById('player-display');
        section.classList.remove('hidden');
        title.textContent = 'Playback: ' + name;
        display.innerHTML = '<iframe src="/api/recordings/' + encodeURIComponent(name) + '/player" class="w-full h-full border-0" style="min-height:400px"></iframe>';
    };

    window.deleteRecording = function(name) {
        if (!confirm('Delete recording "' + name + '"?')) return;
        fetch('/api/recordings/' + encodeURIComponent(name), {
            method: 'DELETE',
            credentials: 'same-origin'
        }).then(function() { loadRecordings(); });
    };

    document.getElementById('player-close')?.addEventListener('click', function() {
        document.getElementById('player-section').classList.add('hidden');
        document.getElementById('player-display').innerHTML = '';
    });

    searchInput?.addEventListener('input', function() {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(function() { loadRecordings(searchInput.value); }, 300);
    });

    loadRecordings();
})();
</script>
{% endblock %}
