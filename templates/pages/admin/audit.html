{% extends "layouts/app.html" %}

{% block title %}{{ site_title }} — Audit Log{% endblock %}

{% block content %}
<div class="max-w-7xl mx-auto">
    <div class="flex items-center justify-between mb-6">
        <div>
            <h1 class="text-2xl font-bold text-[var(--text-primary)]">Audit Log</h1>
            <p class="text-sm text-[var(--text-muted)] mt-1">Tamper-evident event chain with SHA-256 verification</p>
        </div>
        <div class="flex items-center gap-3">
            <div id="chain-status" class="px-3 py-1.5 rounded-lg text-sm font-medium border" aria-live="polite"></div>
            <button onclick="verifyChain()"
                    class="btn btn-info btn-sm">
                Verify Chain
            </button>
            <div class="relative">
                <button onclick="var m=document.getElementById('export-menu');var h=m.classList.toggle('hidden');this.setAttribute('aria-expanded',String(!h))"
                        class="btn btn-secondary btn-sm" aria-expanded="false" aria-controls="export-menu">
                    Export ▾
                </button>
                <div id="export-menu" class="hidden absolute right-0 mt-1 bg-[var(--bg-card)] border border-[var(--border)] rounded-lg shadow-lg py-1 z-10">
                    <button onclick="exportAudit('csv')" class="block w-full text-left px-4 py-2 text-sm text-[var(--text-secondary)] hover:bg-[var(--bg-hover)]">Export CSV</button>
                    <button onclick="exportAudit('json')" class="block w-full text-left px-4 py-2 text-sm text-[var(--text-secondary)] hover:bg-[var(--bg-hover)]">Export JSON</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Filters -->
    <div class="flex items-center gap-4 mb-4">
        <div class="flex items-center gap-2">
            <label class="text-sm text-[var(--text-muted)]">From</label>
            <input type="date" id="audit-from" name="from"
                   hx-get="/api/audit/events"
                   hx-trigger="change"
                   hx-target="#audit-table-body"
                   hx-include="[name='to'],[name='user'],[name='event_type'],[name='outcome']"
                   class="form-input">
        </div>
        <div class="flex items-center gap-2">
            <label class="text-sm text-[var(--text-muted)]">To</label>
            <input type="date" id="audit-to" name="to"
                   hx-get="/api/audit/events"
                   hx-trigger="change"
                   hx-target="#audit-table-body"
                   hx-include="[name='from'],[name='user'],[name='event_type'],[name='outcome']"
                   class="form-input">
        </div>
        <input type="text" name="user" placeholder="User..."
               hx-get="/api/audit/events"
               hx-trigger="keyup changed delay:300ms"
               hx-target="#audit-table-body"
               hx-include="[name='from'],[name='to'],[name='event_type'],[name='outcome']"
               class="form-input">
        <select name="event_type"
                hx-get="/api/audit/events"
                hx-trigger="change"
                hx-target="#audit-table-body"
                hx-include="[name='from'],[name='to'],[name='user'],[name='outcome']"
                class="form-input">
            <option value="">All Events</option>
            <option value="login">Login</option>
            <option value="logout">Logout</option>
            <option value="session_create">Session Create</option>
            <option value="session_delete">Session Delete</option>
            <option value="user_update">User Update</option>
            <option value="auth_config">Auth Config</option>
            <option value="settings_change">Settings Change</option>
        </select>
        <select name="outcome"
                hx-get="/api/audit/events"
                hx-trigger="change"
                hx-target="#audit-table-body"
                hx-include="[name='from'],[name='to'],[name='user'],[name='event_type']"
                class="form-input">
            <option value="">All Outcomes</option>
            <option value="success">Success</option>
            <option value="failure">Failure</option>
        </select>
    </div>

    <!-- Audit Events Table -->
    <div class="card table-wrapper">
        <table class="w-full">
            <thead>
                <tr class="border-b border-[var(--border)] text-left text-xs text-[var(--text-muted)] uppercase tracking-wider">
                    <th>Timestamp</th>
                    <th>Event Type</th>
                    <th>User</th>
                    <th>IP</th>
                    <th>Outcome</th>
                    <th>Details</th>
                    <th class="text-right">Hash</th>
                </tr>
            </thead>
            <tbody id="audit-table-body" class="divide-y divide-[var(--border)]"
                  hx-get="/api/audit/events"
                  hx-trigger="load"
                  hx-swap="innerHTML">
                <tr><td colspan="7" class="px-4 py-8 text-center text-[var(--text-muted)] text-sm">Loading audit events...</td></tr>
            </tbody>
        </table>
    </div>

    <!-- Pagination -->
    <div id="audit-pagination" class="flex items-center justify-between mt-4 text-sm text-[var(--text-muted)]">
        <span id="audit-count"></span>
        <div id="audit-pages" class="flex gap-1"></div>
    </div>
</div>

<script nonce="{{ csp_nonce }}">
function verifyChain() {
    var el = document.getElementById('chain-status');
    el.className = 'px-3 py-1.5 rounded-lg text-sm font-medium border bg-blue-900/50 text-blue-300 border-blue-800';
    el.textContent = 'Verifying...';
    fetch('/api/audit/verify')
        .then(function(r) { return r.json(); })
        .then(function(r) {
            if (r.status === 'verified') {
                el.className = 'px-3 py-1.5 rounded-lg text-sm font-medium border bg-emerald-900/50 text-emerald-300 border-emerald-800';
                el.textContent = 'Verified (' + r.events_scanned + ' events)';
            } else {
                el.className = 'px-3 py-1.5 rounded-lg text-sm font-medium border bg-red-900/50 text-red-300 border-red-800';
                el.textContent = 'Broken (' + r.errors.length + ' errors, ' + r.events_scanned + ' scanned)';
            }
        })
        .catch(function() {
            el.className = 'px-3 py-1.5 rounded-lg text-sm font-medium border bg-[var(--bg-card)] text-[var(--text-muted)] border-[var(--border)]';
            el.textContent = 'Unverified';
        });
}

function exportAudit(format) {
    document.getElementById('export-menu').classList.add('hidden');
    var params = new URLSearchParams();
    var from = document.querySelector('[name="from"]').value;
    var to = document.querySelector('[name="to"]').value;
    var user = document.querySelector('[name="user"]').value;
    var eventType = document.querySelector('[name="event_type"]').value;
    var outcome = document.querySelector('[name="outcome"]').value;
    if (from) params.set('from', from);
    if (to) params.set('to', to);
    if (user) params.set('user', user);
    if (eventType) params.set('event_type', eventType);
    if (outcome) params.set('outcome', outcome);
    params.set('format', format);
    window.location.href = '/api/audit/export?' + params.toString();
}

// Pagination: the server appends a hidden #audit-pagination-data row with
// data-total/data-pages/data-current/data-limit and fires an
// "auditEventsLoaded" HX-Trigger event on #audit-table-body after every
// swap (initial load, filter change, or a page-button click below).
var AUDIT_FILTER_INCLUDE = "[name='from'],[name='to'],[name='user'],[name='event_type'],[name='outcome']";

function renderAuditPagination() {
    var dataRow = document.getElementById('audit-pagination-data');
    var countEl = document.getElementById('audit-count');
    var pagesEl = document.getElementById('audit-pages');
    if (!dataRow || !countEl || !pagesEl) return;

    var total = parseInt(dataRow.getAttribute('data-total'), 10) || 0;
    var totalPages = parseInt(dataRow.getAttribute('data-pages'), 10) || 1;
    var currentPage = parseInt(dataRow.getAttribute('data-current'), 10) || 1;
    var limit = parseInt(dataRow.getAttribute('data-limit'), 10) || 50;

    if (total === 0) {
        countEl.textContent = 'No events';
        pagesEl.innerHTML = '';
        return;
    }
    var rangeStart = (currentPage - 1) * limit + 1;
    var rangeEnd = Math.min(currentPage * limit, total);
    countEl.textContent = 'Showing ' + rangeStart + '–' + rangeEnd + ' of ' + total + ' events';

    var buttons = '';
    function pageButton(label, page, disabled, current) {
        if (disabled) {
            return '<button class="px-2 py-1 rounded border border-[var(--border)] text-[var(--text-muted)] cursor-not-allowed" disabled>' + label + '</button>';
        }
        var cls = current
            ? 'px-2 py-1 rounded border border-[var(--accent)] text-[var(--accent)] font-medium'
            : 'px-2 py-1 rounded border border-[var(--border)] text-[var(--text-secondary)] hover:bg-[var(--bg-hover)]';
        return '<button class="' + cls + '" data-audit-page="' + page + '"' +
            (current ? ' aria-current="page"' : '') + '>' + label + '</button>';
    }

    buttons += pageButton('Prev', currentPage - 1, currentPage <= 1, false);
    // Keep this simple — total_pages for an audit log can be large, so show
    // current +/- 2 rather than every page number.
    var start = Math.max(1, currentPage - 2);
    var end = Math.min(totalPages, currentPage + 2);
    for (var p = start; p <= end; p++) {
        buttons += pageButton(String(p), p, false, p === currentPage);
    }
    buttons += pageButton('Next', currentPage + 1, currentPage >= totalPages, false);
    pagesEl.innerHTML = buttons;

    pagesEl.querySelectorAll('[data-audit-page]').forEach(function(btn) {
        var targetPage = parseInt(btn.getAttribute('data-audit-page'), 10);
        btn.setAttribute('hx-get', '/api/audit/events?offset=' + ((targetPage - 1) * limit));
        btn.setAttribute('hx-target', '#audit-table-body');
        btn.setAttribute('hx-include', AUDIT_FILTER_INCLUDE);
    });
    htmx.process(pagesEl);
}

document.getElementById('audit-table-body').addEventListener('auditEventsLoaded', renderAuditPagination);
</script>
{% endblock %}
