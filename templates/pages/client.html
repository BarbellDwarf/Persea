<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ site_title }} - Session</title>
    <style>
        :root {
            --primary: #e94560; --primary-hover: #c73652;
            --accent: #5bc0be; --accent-hover: #4aa3a1;
            --bg: #1a1a2e; --surface: #16213e; --input: #0f3460;
            --text: #e0e0e0; --text-muted: #aaa; --border: #333;
            --text-dim: #888; --text-on-primary: #fff;
            --toolbar-bg: rgba(22, 33, 62, 0.95);
            --toolbar-height: 48px;
        }
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }

        /* ── Toolbar ─────────────────────────────────────────── */
        #toolbar {
            position: fixed; top: 0; left: 0; right: 0;
            height: var(--toolbar-height);
            background: var(--toolbar-bg);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--border);
            z-index: 1500;
            display: flex; align-items: center;
            padding: 0 12px;
            font-family: 'Segoe UI', system-ui, sans-serif;
            font-size: 13px;
            color: var(--text);
            transform: translateY(0);
            transition: transform 0.25s ease;
            user-select: none;
        }
        #toolbar.hidden { transform: translateY(-100%); }
        #toolbar:hover, #toolbar.force-visible { transform: translateY(0); }

        .tb-left { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
        .tb-right { display: flex; align-items: center; gap: 4px; }

        /* Protocol badge */
        .tb-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            flex-shrink: 0;
        }
        .badge-ssh { background: #1a3a2a; color: #5bc0be; }
        .badge-rdp { background: #2a1a3a; color: #a78bfa; }
        .badge-vnc { background: #3a2a1a; color: #f0c040; }
        .badge-web { background: #1a2a3a; color: #60a5fa; }
        .badge-vdi { background: #0e2a2a; color: #2dd4bf; }
        .badge-spice { background: #3a1a1a; color: #e06060; }
        .badge-proxmox { background: #3d2800; color: #e57000; }

        .tb-info { color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .tb-duration { color: var(--text-dim); font-variant-numeric: tabular-nums; flex-shrink: 0; }

        /* Toolbar buttons */
        .tb-btn {
            background: none; border: 1px solid transparent;
            color: var(--text-muted); border-radius: 4px;
            padding: 4px 8px; cursor: pointer; font-size: 13px;
            display: flex; align-items: center; gap: 4px;
            transition: background 0.15s, color 0.15s;
            white-space: nowrap;
        }
        .tb-btn:hover { background: var(--input); color: var(--text); border-color: var(--border); }
        .tb-btn.danger { color: var(--primary); }
        .tb-btn.danger:hover { background: var(--primary); color: #fff; }
        .tb-btn svg { width: 16px; height: 16px; fill: currentColor; flex-shrink: 0; }

        /* Settings dropdown */
        .tb-settings-wrap { position: relative; }
        .tb-settings {
            display: none; position: absolute; top: calc(100% + 4px); right: 0;
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 6px; padding: 12px 14px; min-width: 220px;
            z-index: 1600; font-size: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }
        .tb-settings.open { display: block; }
        .tb-settings label { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; color: var(--text-muted); }
        .tb-settings input[type=range] { width: 100px; accent-color: var(--accent); }
        .tb-settings input[type=checkbox] { accent-color: var(--accent); }
        .tb-settings .sd-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-dim); margin-bottom: 10px; }

        /* ── Clipboard paste modal ───────────────────────────── */
        #paste-modal-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.6); z-index: 2500;
            justify-content: center; align-items: center;
        }
        #paste-modal-overlay.visible { display: flex; }
        #paste-modal {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 8px; padding: 16px; width: min(420px, 90vw);
            font-family: system-ui, sans-serif;
        }
        #paste-modal h3 { margin: 0 0 10px; font-size: 14px; color: var(--text); }
        #paste-textarea {
            width: 100%; height: 120px; background: var(--input);
            border: 1px solid var(--border); color: var(--text);
            border-radius: 4px; padding: 8px; font-size: 13px;
            font-family: inherit; resize: vertical; box-sizing: border-box;
        }
        #paste-modal .pm-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; }
        #paste-modal .pm-actions button {
            padding: 6px 14px; border-radius: 4px; border: none;
            font-size: 13px; cursor: pointer; font-family: inherit;
        }
        .pm-send { background: var(--accent); color: #000; font-weight: 600; }
        .pm-cancel { background: var(--input); color: var(--text); border: 1px solid var(--border) !important; }

        /* ── Display ─────────────────────────────────────────── */
        #display { width: 100%; height: 100%; }

        /* ── Status bar ──────────────────────────────────────── */
        #status {
            position: fixed; top: var(--toolbar-height); left: 0; right: 0;
            padding: 6px 16px;
            background: rgba(0, 0, 0, 0.8); color: var(--text-muted);
            font-family: monospace; font-size: 12px;
            z-index: 1400; transition: opacity 0.5s;
        }
        #status.connected { opacity: 0; pointer-events: none; }

        /* ── Overlays ────────────────────────────────────────── */
        #disconnected-overlay, #banner-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.85); z-index: 3000;
            justify-content: center; align-items: center;
        }
        #disconnected-overlay.visible, #banner-overlay.visible { display: flex; }
        .overlay-box {
            background: var(--bg); border: 1px solid var(--border);
            border-radius: 8px; padding: 2em 3em;
            max-width: 500px; text-align: center;
            font-family: monospace; color: var(--text);
        }
        .overlay-box h2 { margin: 0 0 0.5em; font-size: 1.3em; }
        .overlay-box p { color: var(--text-muted); margin: 0 0 1.5em; font-size: 0.95em; }
        .overlay-box button {
            padding: 0.6em 2em; border: none; font-family: monospace;
            font-size: 1em; border-radius: 4px; cursor: pointer; margin: 0 0.3em;
        }
        .btn-primary { background: var(--primary); color: var(--text-on-primary); }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-secondary { background: var(--input); color: var(--text); border: 1px solid var(--border) !important; }
        .btn-secondary:hover { background: var(--border); }

        /* ── Theme from localStorage ─────────────────────────── */

        /* ── Mobile responsive ──────────────────────────────── */
        @media (max-width: 768px) {
            .tb-btn { padding: 4px 6px; font-size: 12px; }
            .tb-btn span:not(.tb-badge) { display: none; }
            .tb-badge { font-size: 10px; padding: 1px 6px; }
            .tb-info { font-size: 11px; max-width: 120px; }
            .tb-duration { font-size: 11px; }
            #paste-modal { width: min(340px, 95vw); }
            #paste-textarea { font-size: 16px; } /* prevent iOS zoom */
        }
        @media (max-width: 480px) {
            #toolbar { padding: 0 8px; }
            .tb-left { gap: 6px; }
            .tb-right { gap: 2px; }
            .tb-btn { padding: 4px 4px; }
        }
    </style>
    <script>(function(){var c=localStorage.getItem('rustguac_theme_colors');if(c){try{var o=JSON.parse(c),r=document.documentElement.style;for(var k in o)r.setProperty('--'+k.replace(/_/g,'-'),o[k]);}catch(e){}}})();</script>

    <script src="/guac/Namespace.js"></script>
    <script src="/guac/Client.js"></script>
    <script src="/guac/Display.js"></script>
    <script src="/guac/Event.js"></script>
    <script src="/guac/InputSink.js"></script>
    <script src="/guac/IntegerPool.js"></script>
    <script src="/guac/Keyboard.js"></script>
    <script src="/guac/KeyEventInterpreter.js"></script>
    <script src="/guac/Layer.js"></script>
    <script src="/guac/Mouse.js"></script>
    <script src="/guac/Parser.js"></script>
    <script src="/guac/Position.js"></script>
    <script src="/guac/Status.js"></script>
    <script src="/guac/Touch.js"></script>
    <script src="/guac/Tunnel.js"></script>
    <script src="/guac/UTF8Parser.js"></script>
    <script src="/guac/InputStream.js"></script>
    <script src="/guac/OutputStream.js"></script>
    <script src="/guac/StringReader.js"></script>
    <script src="/guac/StringWriter.js"></script>
    <script src="/guac/ArrayBufferReader.js"></script>
    <script src="/guac/ArrayBufferWriter.js"></script>
    <script src="/guac/BlobReader.js"></script>
    <script src="/guac/BlobWriter.js"></script>
    <script src="/guac/DataURIReader.js"></script>
    <script src="/guac/AudioContextFactory.js"></script>
    <script src="/guac/AudioPlayer.js"></script>
    <script src="/guac/AudioRecorder.js"></script>
    <script src="/guac/VideoPlayer.js"></script>
    <script src="/guac/H264Decoder.js"></script>
    <script src="/guac/JSONReader.js"></script>
    <script src="/guac/Object.js"></script>
    <script src="/guac/RawAudioFormat.js"></script>
    <script src="/guac/SessionRecording.js"></script>
</head>
<body>
    <!-- ── Toolbar ──────────────────────────────────────── -->
    <div id="toolbar">
        <div class="tb-left">
            <span id="tb-badge" class="tb-badge badge-ssh">SSH</span>
            <span id="tb-host" class="tb-info"></span>
            <span id="tb-duration" class="tb-duration">00:00:00</span>
        </div>
        <div class="tb-right">
            <button class="tb-btn" id="btn-clipboard" title="Paste text to remote (Ctrl+Alt+Shift)">
                <svg viewBox="0 0 24 24"><path d="M19 2h-4.18C14.4.84 13.3 0 12 0S9.6.84 9.18 2H5a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm7 18H5V4h2v3h10V4h2v16z"/></svg>
                Paste
            </button>
            <button class="tb-btn" id="btn-fullscreen" title="Toggle fullscreen (F11)">
                <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
            </button>
            <button class="tb-btn" id="btn-screenshot" title="Save screenshot">
                <svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
            </button>
            <div class="tb-settings-wrap">
                <button class="tb-btn" id="btn-settings" title="Settings">
                    <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/></svg>
                </button>
                <div class="tb-settings" id="settings-dropdown">
                    <div class="sd-title">Settings</div>
                    <label>JPEG Quality
                        <input type="range" id="cfg-quality" min="1" max="100" value="80">
                    </label>
                    <label>Audio
                        <input type="checkbox" id="cfg-audio" checked>
                    </label>
                    <label>Clipboard auto-sync
                        <input type="checkbox" id="cfg-clipboard" checked>
                    </label>
                </div>
            </div>
            <button class="tb-btn danger" id="btn-disconnect" title="Disconnect">
                <svg viewBox="0 0 24 24"><path d="M13 3h-2v10h2V3zm4.83 2.17l-1.42 1.42A6.92 6.92 0 0 1 19 12c0 3.87-3.13 7-7 7s-7-3.13-7-7c0-2.13.94-4.05 2.42-5.36L6 5.17A8.94 8.94 0 0 0 3 12c0 4.97 4.03 9 9 9s9-4.03 9-9a8.94 8.94 0 0 0-3.17-6.83z"/></svg>
            </button>
        </div>
    </div>

    <!-- ── Paste modal ───────────────────────────────────── -->
    <div id="paste-modal-overlay">
        <div id="paste-modal">
            <h3>Paste text to remote session</h3>
            <textarea id="paste-textarea" placeholder="Paste or type text here..."></textarea>
            <div class="pm-actions">
                <button class="pm-cancel" id="pm-cancel">Cancel</button>
                <button class="pm-send" id="pm-send">Send</button>
            </div>
        </div>
    </div>

    <!-- ── Status ────────────────────────────────────────── -->
    <div id="status">Loading...</div>

    <!-- ── Overlays ──────────────────────────────────────── -->
    <div id="disconnected-overlay">
        <div class="overlay-box">
            <h2 id="disconnected-title">Session Ended</h2>
            <p id="disconnected-message">The remote session has been disconnected.</p>
            <div>
                <button id="btn-reconnect" class="btn-secondary">Reconnect</button>
                <button id="btn-close-session" class="btn-primary">Close</button>
            </div>
        </div>
    </div>
    <div id="banner-overlay">
        <div class="overlay-box">
            <div id="banner-text"></div>
            <button id="banner-continue" class="btn-primary">Continue</button>
        </div>
    </div>

    <!-- ── Display ────────────────────────────────────────── -->
    <div id="display"></div>

    <script>
    (function() {
        'use strict';

        // ── Config ──
        var pathParts = window.location.pathname.split('/');
        var sessionId = pathParts[pathParts.length - 1];
        if (!sessionId) { document.getElementById('status').textContent = 'Error: No session ID'; throw new Error('No session ID'); }

        var statusEl = document.getElementById('status');
        var urlParams = new URLSearchParams(window.location.search);
        var shareToken = urlParams.get('token');
        var apiKey = sessionStorage.getItem('rustguac_api_key');
        var urlTicket = urlParams.get('ticket');
        var entryName = urlParams.get('name');
        var relaunchInfo = null;
        var entryDisplayName = '';
        var wantFullscreen = false;
        var wantAutohideTabs = false;
        var protocol = '';
        var targetHost = '';
        var connectStartTime = Date.now();

        // ── Settings state ──
        var cfgQuality = parseInt(localStorage.getItem('rg_quality') || '80', 10);
        var cfgAudio = localStorage.getItem('rg_audio') !== 'false';
        var cfgClipboardSync = localStorage.getItem('rg_clipboard') !== 'false';
        document.getElementById('cfg-quality').value = cfgQuality;
        document.getElementById('cfg-audio').checked = cfgAudio;
        document.getElementById('cfg-clipboard').checked = cfgClipboardSync;
        document.getElementById('cfg-quality').addEventListener('input', function() {
            cfgQuality = parseInt(this.value, 10);
            localStorage.setItem('rg_quality', cfgQuality);
        });
        document.getElementById('cfg-audio').addEventListener('change', function() {
            cfgAudio = this.checked;
            localStorage.setItem('rg_audio', cfgAudio);
        });
        document.getElementById('cfg-clipboard').addEventListener('change', function() {
            cfgClipboardSync = this.checked;
            localStorage.setItem('rg_clipboard', cfgClipboardSync);
        });

        // ── Settings dropdown toggle ──
        var settingsOpen = false;
        document.getElementById('btn-settings').addEventListener('click', function(e) {
            e.stopPropagation();
            settingsOpen = !settingsOpen;
            document.getElementById('settings-dropdown').classList.toggle('open', settingsOpen);
        });
        document.addEventListener('click', function() {
            if (settingsOpen) { settingsOpen = false; document.getElementById('settings-dropdown').classList.remove('open'); }
        });

        // ── Auto-reconnect ──
        var userDisconnected = false;
        var reconnectAttempts = 0;
        var maxReconnectAttempts = 5;
        var reconnectDelays = [1000, 2000, 4000, 8000, 16000];

        // ── Toolbar auto-hide ──
        var toolbarEl = document.getElementById('toolbar');
        var toolbarHideTimer = null;
        var toolbarForced = false;
        function toolbarReveal() {
            toolbarEl.classList.remove('hidden');
            if (toolbarHideTimer) { clearTimeout(toolbarHideTimer); toolbarHideTimer = null; }
        }
        function toolbarScheduleHide(delayMs) {
            if (toolbarHideTimer) clearTimeout(toolbarHideTimer);
            toolbarHideTimer = setTimeout(function() {
                if (!toolbarForced) toolbarEl.classList.add('hidden');
                toolbarHideTimer = null;
            }, delayMs);
        }
        document.addEventListener('mousemove', function(e) {
            if (e.clientY <= 4) toolbarReveal();
            else if (e.clientY > 52 && !toolbarForced) toolbarScheduleHide(1500);
        });
        toolbarEl.addEventListener('mouseenter', function() {
            if (toolbarHideTimer) { clearTimeout(toolbarHideTimer); toolbarHideTimer = null; }
        });

        // ── Duration timer ──
        var durationEl = document.getElementById('tb-duration');
        function updateDuration() {
            var elapsed = Math.floor((Date.now() - connectStartTime) / 1000);
            var h = Math.floor(elapsed / 3600);
            var m = Math.floor((elapsed % 3600) / 60);
            var s = elapsed % 60;
            durationEl.textContent = (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
        }
        setInterval(updateDuration, 1000);

        // ── Toolbar badge helpers ──
        function setProtocolBadge(proto, host) {
            protocol = (proto || '').toUpperCase();
            targetHost = host || '';
            var badge = document.getElementById('tb-badge');
            badge.textContent = protocol;
            badge.className = 'tb-badge badge-' + protocol.toLowerCase();
            document.getElementById('tb-host').textContent = targetHost;
        }

        // ── Screenshot ──
        document.getElementById('btn-screenshot').addEventListener('click', function() {
            if (!window.__guac_client) return;
            try {
                var canvas = window.__guac_client.getDisplay().flatten();
                if (!canvas || canvas.width === 0) return;
                var a = document.createElement('a');
                a.href = canvas.toDataURL('image/png');
                a.download = 'rustguac-' + sessionId.substring(0, 8) + '-' + Date.now() + '.png';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            } catch (e) { console.warn('[rustguac] screenshot failed:', e); }
        });

        // ── Fullscreen ──
        function rgFullscreenEl() {
            return document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement || null;
        }
        function rgEnterFullscreen() {
            var el = document.documentElement;
            var req = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
            if (!req) return;
            try { req.call(el); } catch (e) {}
        }
        function rgExitFullscreen() {
            try { if (navigator.keyboard && navigator.keyboard.unlock) navigator.keyboard.unlock(); } catch (e) {}
            var x = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen;
            if (x) { try { x.call(document); } catch (e) {} }
        }
        document.getElementById('btn-fullscreen').addEventListener('click', function() {
            if (rgFullscreenEl()) rgExitFullscreen(); else rgEnterFullscreen();
        });
        document.addEventListener('keydown', function(e) {
            if (e.key === 'F11' && !e.ctrlKey && !e.altKey && !e.shiftKey && !e.metaKey) {
                e.preventDefault();
                if (rgFullscreenEl()) rgExitFullscreen(); else rgEnterFullscreen();
            }
        });

        // ── Disconnect ──
        document.getElementById('btn-disconnect').addEventListener('click', function() {
            userDisconnected = true;
            try { if (window.__guac_client) window.__guac_client.disconnect(); } catch (e) {}
            window.location.href = '/connections.html';
        });

        // ── Paste modal ──
        var pasteOverlay = document.getElementById('paste-modal-overlay');
        var pasteTextarea = document.getElementById('paste-textarea');
        document.getElementById('btn-clipboard').addEventListener('click', function() {
            pasteTextarea.value = '';
            pasteOverlay.classList.add('visible');
            pasteTextarea.focus();
            if (navigator.clipboard && navigator.clipboard.readText) {
                navigator.clipboard.readText().then(function(t) { if (t) pasteTextarea.value = t; }).catch(function() {});
            }
        });
        document.getElementById('pm-cancel').addEventListener('click', function() { pasteOverlay.classList.remove('visible'); displayEl.focus(); });
        document.getElementById('pm-send').addEventListener('click', function() {
            var text = pasteTextarea.value;
            if (text) sendClipboardToRemote(text);
            pasteOverlay.classList.remove('visible');
            displayEl.focus();
        });

        // ── Ctrl+Alt+Shift toggle toolbar ──
        var lastToggleTime = 0;
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.altKey && e.shiftKey) {
                e.preventDefault();
                e.stopImmediatePropagation();
                var now = Date.now();
                if (now - lastToggleTime < 500) return;
                lastToggleTime = now;
                toolbarForced = !toolbarForced;
                if (toolbarForced) {
                    toolbarEl.classList.remove('hidden');
                    toolbarEl.classList.add('force-visible');
                } else {
                    toolbarEl.classList.remove('force-visible');
                    toolbarScheduleHide(2000);
                }
            }
        }, true);

        // ── Theme / site title ──
        fetch('/api/auth/status').then(function(r){return r.json()}).then(function(d){
            var siteTitle = d.site_title || 'rustguac';
            document.title = entryName ? (entryName + ' \u2014 ' + siteTitle) : (siteTitle + ' - Session');
            if (typeof initTheme === 'function') initTheme(d.theme);
        });

        // ── Banner ──
        function showBanner(bannerText) {
            if (!bannerText) return Promise.resolve();
            return new Promise(function(resolve) {
                document.getElementById('banner-text').textContent = bannerText;
                document.getElementById('banner-overlay').className = 'visible';
                document.getElementById('banner-continue').addEventListener('click', function() {
                    document.getElementById('banner-overlay').className = '';
                    resolve();
                });
            });
        }

        // ── Boot ──
        if (urlTicket) { startGuacamole(); }
        else if (shareToken) {
            fetch('/api/sessions/' + sessionId + '/banner?token=' + encodeURIComponent(shareToken))
            .then(function(r) { return r.ok ? r.json() : null; })
            .then(function(d) { return showBanner(d && d.banner); })
            .then(function() { startGuacamole(); })
            .catch(function() { startGuacamole(); });
        } else {
            var fetchHeaders = {};
            if (apiKey) fetchHeaders['Authorization'] = 'Bearer ' + apiKey;
            fetch('/api/sessions/' + sessionId, { headers: fetchHeaders, credentials: 'same-origin' })
            .then(function(res) {
                if (!res.ok) { statusEl.textContent = 'Error: Session not found'; throw new Error('Session not found'); }
                return res.json();
            })
            .then(function(session) {
                if (session && session.address_book_entry) {
                    relaunchInfo = { entry_key: session.address_book_entry, folder: session.address_book_folder || '', display_name: session.entry_display_name || '' };
                }
                if (session && session.entry_display_name) entryDisplayName = session.entry_display_name;
                if (session && session.fullscreen_on_connect) wantFullscreen = true;
                if (session && session.autohide_side_tabs) wantAutohideTabs = true;
                // Set protocol badge from session metadata
                if (session && session.protocol) setProtocolBadge(session.protocol, session.address || session.address_book_folder || '');
                else if (entryName) setProtocolBadge('SSH', entryName);
                return showBanner(session.banner);
            })
            .then(function() { startGuacamole(); })
            .catch(function(err) { statusEl.textContent = 'Error: ' + err.message; });
        }

        function attemptReconnect() {
            if (reconnectAttempts >= maxReconnectAttempts) {
                document.getElementById('disconnected-title').textContent = 'Session Ended';
                document.getElementById('disconnected-message').textContent = 'Connection lost after ' + maxReconnectAttempts + ' attempts.';
                document.getElementById('disconnected-overlay').className = 'visible';
                return;
            }
            var delay = reconnectDelays[reconnectAttempts];
            reconnectAttempts++;
            statusEl.textContent = 'Reconnecting... (attempt ' + reconnectAttempts + '/' + maxReconnectAttempts + ')';
            statusEl.className = '';
            document.getElementById('disconnected-overlay').classList.remove('visible');
            setTimeout(function() { connectWebSocket(urlTicket); }, delay);
        }

        function connectWebSocket(ticketParam) {
            var wsProtocol = (window.location.protocol === 'https:') ? 'wss:' : 'ws:';
            var wsUrl = wsProtocol + '//' + window.location.host + '/ws/' + sessionId;
            if (ticketParam) wsUrl += '?ticket=' + encodeURIComponent(ticketParam);
            var tunnel = new Guacamole.WebSocketTunnel(wsUrl);
            var client = new Guacamole.Client(tunnel);
            window.__guac_client = client;
            setupClient(client, tunnel);
        }

        function startGuacamole() {
            statusEl.textContent = 'Connecting to session ' + sessionId.substring(0, 8) + '...';
            if (urlTicket) { connectWebSocket(urlTicket); return; }
            if (apiKey) {
                fetch('/api/ws-ticket', { method: 'POST', headers: { 'Authorization': 'Bearer ' + apiKey } })
                .then(function(r) { return r.json(); })
                .then(function(d) { if (d.ticket) connectWebSocket(d.ticket); else statusEl.textContent = 'Failed to obtain ticket'; })
                .catch(function(e) { statusEl.textContent = 'Ticket error: ' + e.message; });
                return;
            }
            connectWebSocket(null);
        }

        function setupClient(client, tunnel) {
            var displayEl = document.getElementById('display');
            displayEl.appendChild(client.getDisplay().getElement());

            // Resume AudioContext
            function resumeAudio() {
                var ctx = Guacamole.AudioContextFactory.getAudioContext();
                if (ctx && ctx.state === 'suspended') ctx.resume().catch(function(){});
            }
            ['click', 'keydown', 'mousedown', 'touchstart'].forEach(function(evt) {
                document.addEventListener(evt, resumeAudio, true);
            });

            // ── Clipboard ──
            var remoteClipboard = '';
            function sendClipboardToRemote(text) {
                var stream = client.createClipboardStream('text/plain');
                var writer = new Guacamole.StringWriter(stream);
                for (var i = 0; i < text.length; i += 4096) writer.sendText(text.substring(i, i + 4096));
                writer.sendEnd();
            }
            client.onclipboard = function(stream, mimetype) {
                if (!cfgClipboardSync || mimetype !== 'text/plain') { var r = new Guacamole.StringReader(stream); r.ontext = function(){}; r.onend = function(){}; return; }
                var data = '';
                var reader = new Guacamole.StringReader(stream);
                reader.ontext = function(t) { data += t; };
                reader.onend = function() {
                    remoteClipboard = data;
                    if (navigator.clipboard && navigator.clipboard.writeText && document.hasFocus()) {
                        navigator.clipboard.writeText(data).catch(function(){});
                    }
                };
            };

            // ── File system ──
            var filesystem = null;
            client.onfilesystem = function(object, name) { filesystem = object; };
            client.onfile = function(stream, mimetype, filename) {
                var reader = new Guacamole.BlobReader(stream, mimetype);
                reader.onend = function() {
                    var blob = reader.getBlob();
                    var a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = filename;
                    document.body.appendChild(a); a.click(); document.body.removeChild(a);
                    setTimeout(function() { URL.revokeObjectURL(a.href); }, 1000);
                };
            };

            // ── State ──
            var _thumbInterval = null;
            function captureThumbnail() {
                try {
                    var canvas = client.getDisplay().flatten();
                    if (!canvas || canvas.width === 0) return;
                    var thumb = document.createElement('canvas');
                    thumb.width = 320;
                    thumb.height = Math.round(320 * canvas.height / canvas.width) || 180;
                    thumb.getContext('2d').drawImage(canvas, 0, 0, thumb.width, thumb.height);
                    thumb.toBlob(function(blob) {
                        if (!blob) return;
                        var headers = {};
                        if (apiKey) headers['Authorization'] = 'Bearer ' + apiKey;
                        fetch('/api/sessions/' + sessionId + '/thumbnail', { method: 'PUT', headers: headers, credentials: 'same-origin', body: blob }).catch(function(){});
                    }, 'image/jpeg', 0.6);
                } catch(e) {}
            }

            client.onstatechange = function(state) {
                switch (state) {
                    case Guacamole.Client.State.CONNECTING: statusEl.textContent = 'Connecting...'; statusEl.className = ''; break;
                    case Guacamole.Client.State.WAITING: statusEl.textContent = 'Waiting for server...'; statusEl.className = ''; break;
                    case Guacamole.Client.State.CONNECTED:
                        statusEl.textContent = 'Connected'; statusEl.className = 'connected';
                        reconnectAttempts = 0;
                        connectStartTime = Date.now();
                        updateDuration();
                        (function() {
                            var fitToWindow = function() { scaleDisplay(); client.sendSize(window.innerWidth, window.innerHeight); };
                            setTimeout(fitToWindow, 800);
                            setTimeout(fitToWindow, 2000);
                            setTimeout(fitToWindow, 4000);
                        })();
                        if (!shareToken && !_thumbInterval) {
                            _thumbInterval = setInterval(captureThumbnail, 10000);
                            setTimeout(captureThumbnail, 3000);
                        }
                        if (wantFullscreen) {
                            var fire = function() {
                                document.removeEventListener('mousedown', fire, true);
                                document.removeEventListener('keydown', fire, true);
                                rgEnterFullscreen();
                            };
                            document.addEventListener('mousedown', fire, true);
                            document.addEventListener('keydown', fire, true);
                        }
                        break;
                    case Guacamole.Client.State.DISCONNECTING:
                        statusEl.textContent = 'Disconnecting...'; statusEl.className = '';
                        if (_thumbInterval) { clearInterval(_thumbInterval); _thumbInterval = null; captureThumbnail(); }
                        break;
                    case Guacamole.Client.State.DISCONNECTED:
                        statusEl.textContent = 'Disconnected'; statusEl.className = '';
                        if (_thumbInterval) { clearInterval(_thumbInterval); _thumbInterval = null; }
                        if (userDisconnected) {
                            document.getElementById('disconnected-title').textContent = 'Session Ended';
                            document.getElementById('disconnected-message').textContent = 'The remote session has been disconnected.';
                            document.getElementById('disconnected-overlay').className = 'visible';
                        } else { attemptReconnect(); }
                        if (rgFullscreenEl()) rgExitFullscreen();
                        break;
                }
            };

            client.onerror = function(status) {
                statusEl.textContent = 'Error: ' + (status.message || 'Unknown error');
                statusEl.className = '';
                if (_thumbInterval) { clearInterval(_thumbInterval); _thumbInterval = null; }
                document.getElementById('disconnected-title').textContent = 'Connection Error';
                document.getElementById('disconnected-message').textContent = status.message || 'An error occurred.';
                document.getElementById('disconnected-overlay').className = 'visible';
                if (rgFullscreenEl()) rgExitFullscreen();
            };

            tunnel.onerror = function(status) {
                if (client.onerror) client.onerror(status || { code: 519, message: 'Connection lost' });
            };
            tunnel.onstatechange = function(state) {
                if (state === Guacamole.Tunnel.State.CLOSED) {
                    if (!userDisconnected) attemptReconnect();
                    else if (client.onerror) client.onerror({ code: 519, message: 'Connection lost' });
                } else if (state === Guacamole.Tunnel.State.UNSTABLE) {
                    statusEl.textContent = 'Connection unstable...';
                }
            };

            // Disconnected overlay buttons
            document.getElementById('btn-close-session').addEventListener('click', function() {
                userDisconnected = true;
                window.location.href = '/';
            });
            document.getElementById('btn-reconnect').addEventListener('click', function() {
                var btn = this;
                btn.disabled = true; btn.textContent = 'Reconnecting...';
                if (shareToken) { window.location.reload(); return; }
                if (!relaunchInfo) { window.location.href = '/connections.html'; return; }
                var key = relaunchInfo.entry_key;
                var firstSlash = key.indexOf('/');
                var lastSlash = key.lastIndexOf('/');
                if (firstSlash < 0 || lastSlash <= firstSlash) { window.location.href = '/connections.html'; return; }
                var scope = key.substring(0, firstSlash);
                var folder = relaunchInfo.folder;
                var entry = key.substring(lastSlash + 1);
                var headers = { 'Content-Type': 'application/json' };
                if (apiKey) headers['Authorization'] = 'Bearer ' + apiKey;
                fetch('/api/addressbook/folders/' + encodeURIComponent(scope) + '/' + encodeURIComponent(folder) + '/entries/' + encodeURIComponent(entry) + '/connect', {
                    method: 'POST', headers: headers, credentials: 'same-origin',
                    body: JSON.stringify({ width: window.innerWidth, height: window.innerHeight, dpi: Math.round((window.devicePixelRatio || 1) * 96) })
                })
                .then(function(res) { if (!res.ok) { window.location.href = '/connections.html'; return; } return res.json().then(function(d) { window.location.href = d && d.client_url ? d.client_url : '/connections.html'; }); })
                .catch(function() { window.location.href = '/connections.html'; });
            });

            // ── Keyboard ──
            displayEl.tabIndex = 0;
            displayEl.style.outline = 'none';
            displayEl.focus();
            var keyboard = new Guacamole.Keyboard(displayEl);

            // Ctrl+V clipboard sync
            var _pasteIntercepted = false;
            document.addEventListener('keydown', function(e) {
                if ((e.ctrlKey || e.metaKey) && (e.key === 'v' || e.key === 'V') && !e.altKey && !e.repeat && cfgClipboardSync) {
                    if (navigator.clipboard && navigator.clipboard.readText) {
                        e.stopPropagation(); e.preventDefault(); _pasteIntercepted = true;
                        navigator.clipboard.readText().then(function(text) {
                            if (text && text !== remoteClipboard) { sendClipboardToRemote(text); remoteClipboard = text; }
                        }).catch(function() {}).finally(function() {
                            client.sendKeyEvent(1, 0x76); client.sendKeyEvent(0, 0x76);
                        });
                    }
                }
            }, true);
            document.addEventListener('keyup', function(e) {
                if (_pasteIntercepted && (e.key === 'v' || e.key === 'V')) { e.stopPropagation(); e.preventDefault(); _pasteIntercepted = false; }
            }, true);

            keyboard.onkeydown = function(keysym) { client.sendKeyEvent(1, keysym); };
            keyboard.onkeyup = function(keysym) { client.sendKeyEvent(0, keysym); };
            window.addEventListener('blur', function() { keyboard.reset(); });
            document.addEventListener('visibilitychange', function() { if (document.hidden) keyboard.reset(); });

            // Mouse
            var mouse = new Guacamole.Mouse(client.getDisplay().getElement());
            mouse.onEach(['mousedown', 'mousemove', 'mouseup'], function(e) { client.sendMouseState(e.state, true); });

            // ── Scale display ──
            var _scaleDisplay = null;
            function scaleDisplay() {
                var display = client.getDisplay();
                var dw = display.getWidth();
                var dh = display.getHeight();
                if (dw <= 0 || dh <= 0) return;
                var tbH = toolbarEl.classList.contains('hidden') ? 0 : 48;
                var availW = window.innerWidth;
                var availH = window.innerHeight - tbH;
                display.scale(Math.min(availW / dw, availH / dh));
                var el = display.getElement();
                el.style.marginLeft = Math.max(0, (availW - dw * display.getScale()) / 2) + 'px';
                el.style.marginTop = Math.max(0, (availH - dh * display.getScale()) / 2) + tbH + 'px';
            }
            _scaleDisplay = scaleDisplay;
            displayEl.style.position = 'absolute';
            displayEl.style.top = '0';
            displayEl.style.left = '0';
            client.getDisplay().onresize = function() { if (_scaleDisplay) _scaleDisplay(); };
            var resizeTimer = null;
            window.addEventListener('resize', function() {
                if (_scaleDisplay) _scaleDisplay();
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(function() { client.sendSize(window.innerWidth, window.innerHeight); }, 250);
            });
            // Re-scale when toolbar hides/shows
            var toolbarObs = new MutationObserver(function() { if (_scaleDisplay) _scaleDisplay(); });
            toolbarObs.observe(toolbarEl, { attributes: true, attributeFilter: ['class'] });

            var connectData = shareToken ? 'token=' + encodeURIComponent(shareToken) : '';
            client.connect(connectData);
        }
    })();
    </script>
</body>
</html>
