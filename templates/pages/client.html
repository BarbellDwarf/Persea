<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ site_title }} - Session</title>
    <!-- Favicon: plain leaf; swapped to the live variant (/favicon-live.svg)
         while the session is active, back to plain on end. -->
    <link rel="icon" type="image/svg+xml" id="persea-favicon" href="/favicon.svg">
    <style>
        :root {
            --primary: #e94560; --primary-hover: #c73652;
            --accent: #5bc0be; --accent-hover: #4aa3a1;
            --bg: #1a1a2e; --surface: #16213e; --input: #0f3460;
            --text: #e0e0e0; --text-muted: #aaa; --border: #333;
            --text-dim: #999; --text-on-primary: #fff;
            --toolbar-bg: rgba(22, 33, 62, 0.95);
            --toolbar-height: 48px;
        }
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }

        /* ── Toolbar ─────────────────────────────────────────── */
        #toolbar {
            position: fixed; top: 0; left: 0; right: 0;
            height: var(--toolbar-height);
            background: var(--toolbar-bg);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--border);
            z-index: 1500;
            display: flex; align-items: center;
            padding: 0 12px;
            font-family: 'Segoe UI', system-ui, sans-serif;
            font-size: 13px;
            color: var(--text);
            transform: translateY(0);
            transition: transform 0.25s ease;
            user-select: none;
        }
        #toolbar.hidden { transform: translateY(-100%); }
        #toolbar:hover, #toolbar.force-visible { transform: translateY(0); }

        .tb-left { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
        .tb-right { display: flex; align-items: center; gap: 4px; }

        /* Protocol badge */
        .tb-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            flex-shrink: 0;
        }
        .badge-ssh { background: #1a3a2a; color: #5bc0be; }
        .badge-rdp { background: #2a1a3a; color: #a78bfa; }
        .badge-vnc { background: #3a2a1a; color: #f0c040; }
        .badge-web { background: #1a2a3a; color: #60a5fa; }
        .badge-vdi { background: #0e2a2a; color: #2dd4bf; }
        .badge-spice { background: #3a1a1a; color: #e06060; }
        .badge-proxmox { background: #3d2800; color: #e57000; }

        .tb-info { color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .tb-duration { color: var(--text-dim); font-variant-numeric: tabular-nums; flex-shrink: 0; }
        .tb-name { color: var(--text); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 200px; }
        .tb-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; background: #6b7280; }
        .tb-dot.dot-live { background: #34d399; box-shadow: 0 0 6px rgba(52, 211, 153, 0.7); }
        .tb-dot.dot-warn { background: #fbbf24; box-shadow: 0 0 6px rgba(251, 191, 36, 0.6); }
        .tb-dot.dot-ended { background: #ef4444; box-shadow: 0 0 6px rgba(239, 68, 68, 0.6); }

        /* Toolbar buttons */
        .tb-btn {
            background: none; border: 1px solid transparent;
            color: var(--text-muted); border-radius: 4px;
            padding: 4px 8px; cursor: pointer; font-size: 13px;
            display: flex; align-items: center; gap: 4px;
            transition: background 0.15s, color 0.15s;
            white-space: nowrap;
        }
        .tb-btn:hover { background: var(--input); color: var(--text); border-color: var(--border); }
        .tb-btn.danger { color: var(--primary); }
        .tb-btn.danger:hover { background: var(--primary); color: #fff; }
        .tb-btn svg { width: 16px; height: 16px; fill: currentColor; flex-shrink: 0; }

        /* Settings dropdown */
        .tb-settings-wrap { position: relative; }
        .tb-settings {
            display: none; position: absolute; top: calc(100% + 4px); right: 0;
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 6px; padding: 12px 14px; min-width: 220px;
            z-index: 1600; font-size: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }
        .tb-settings.open { display: block; }
        .tb-settings label { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; color: var(--text-muted); }
        .tb-settings input[type=range] { width: 100px; accent-color: var(--accent); }
        .tb-settings input[type=checkbox] { accent-color: var(--accent); }
        .tb-settings .sd-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-dim); margin-bottom: 10px; }

        /* ── Clipboard paste modal ───────────────────────────── */
        #paste-modal-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.6); z-index: 2500;
            justify-content: center; align-items: center;
        }
        #paste-modal-overlay.visible { display: flex; }
        #paste-modal {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 8px; padding: 16px; width: min(420px, 90vw);
            font-family: system-ui, sans-serif;
        }
        #paste-modal h3 { margin: 0 0 10px; font-size: 14px; color: var(--text); }
        #paste-textarea {
            width: 100%; height: 120px; background: var(--input);
            border: 1px solid var(--border); color: var(--text);
            border-radius: 4px; padding: 8px; font-size: 13px;
            font-family: inherit; resize: vertical; box-sizing: border-box;
        }
        #paste-modal .pm-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; }
        #paste-modal .pm-actions button {
            padding: 6px 14px; border-radius: 4px; border: none;
            font-size: 13px; cursor: pointer; font-family: inherit;
        }
        .pm-send { background: var(--accent); color: #000; font-weight: 600; }
        .pm-cancel { background: var(--input); color: var(--text); border: 1px solid var(--border) !important; }

        /* ── Display ─────────────────────────────────────────── */
        #display { width: 100%; height: 100%; }

        /* ── File browser panel (SSH SFTP) ───────────────────── */
        #file-browser-panel {
            display: none; position: fixed;
            top: var(--toolbar-height); right: 0; bottom: 0;
            width: min(340px, 85vw);
            background: var(--surface); border-left: 1px solid var(--border);
            z-index: 1500; font-family: system-ui, sans-serif; font-size: 13px;
            flex-direction: column; color: var(--text);
        }
        #file-browser-panel.open { display: flex; }
        .fb-header {
            display: flex; align-items: center; gap: 8px;
            padding: 6px 10px; border-bottom: 1px solid var(--border);
        }
        .fb-title {
            flex: 1; font-weight: 600; font-size: 11px;
            text-transform: uppercase; letter-spacing: 0.06em;
            color: var(--text-muted); overflow: hidden;
            text-overflow: ellipsis; white-space: nowrap;
        }
        #fb-path {
            padding: 6px 12px; border-bottom: 1px solid var(--border);
            color: var(--accent); font-family: monospace; font-size: 12px;
            word-break: break-all; user-select: text;
        }
        #fb-list { flex: 1; overflow-y: auto; padding: 4px 0; }
        .fb-item {
            display: flex; align-items: center; gap: 8px;
            padding: 6px 12px; cursor: pointer; color: var(--text);
        }
        .fb-item:hover { background: var(--input); }
        .fb-item .fb-ico { width: 16px; height: 16px; fill: var(--text-dim); flex-shrink: 0; }
        .fb-item.fb-dir .fb-ico { fill: var(--accent); }
        .fb-item .fb-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .fb-empty { padding: 14px 12px; color: var(--text-dim); text-align: center; }
        #fb-status {
            padding: 6px 12px; border-top: 1px solid var(--border);
            color: var(--text-dim); font-size: 12px; min-height: 28px;
        }

        /* ── Status bar ──────────────────────────────────────── */
        #status {
            position: fixed; top: var(--toolbar-height); left: 0; right: 0;
            padding: 6px 16px;
            background: rgba(0, 0, 0, 0.8); color: var(--text-muted);
            font-family: monospace; font-size: 12px;
            z-index: 1400; transition: opacity 0.5s;
        }
        #status.connected { opacity: 0; pointer-events: none; }

        /* ── Overlays ────────────────────────────────────────── */
        #disconnected-overlay, #banner-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.85); z-index: 3000;
            justify-content: center; align-items: center;
        }
        #disconnected-overlay.visible, #banner-overlay.visible { display: flex; }
        .overlay-box {
            background: var(--bg); border: 1px solid var(--border);
            border-radius: 8px; padding: 2em 3em;
            max-width: 500px; text-align: center;
            font-family: monospace; color: var(--text);
        }
        .overlay-box h2 { margin: 0 0 0.5em; font-size: 1.3em; }
        .overlay-box p { color: var(--text-muted); margin: 0 0 1.5em; font-size: 0.95em; }
        .overlay-box button {
            padding: 0.6em 2em; border: none; font-family: monospace;
            font-size: 1em; border-radius: 4px; cursor: pointer; margin: 0 0.3em;
        }
        .btn-primary { background: var(--primary); color: var(--text-on-primary); }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-secondary { background: var(--input); color: var(--text); border: 1px solid var(--border) !important; }
        .btn-secondary:hover { background: var(--border); }

        /* ── Theme from localStorage ─────────────────────────── */

        /* ── Mobile responsive ──────────────────────────────── */
        @media (max-width: 768px) {
            .tb-btn { padding: 4px 6px; font-size: 12px; }
            .tb-btn span:not(.tb-badge) { display: none; }
            .tb-badge { font-size: 10px; padding: 1px 6px; }
            .tb-info { font-size: 11px; max-width: 120px; }
            .tb-name { font-size: 11px; max-width: 110px; }
            .tb-duration { font-size: 11px; }
            #paste-modal { width: min(340px, 95vw); }
            #paste-textarea { font-size: 16px; } /* prevent iOS zoom */
        }
        @media (max-width: 480px) {
            #toolbar { padding: 0 8px; }
            .tb-left { gap: 6px; }
            .tb-right { gap: 2px; }
            .tb-btn { padding: 4px 4px; }
            #btn-disconnect { margin-left: 8px; }
        }
    </style>
    <script>(function(){var c=localStorage.getItem('persea_theme_colors');if(c){try{var o=JSON.parse(c),r=document.documentElement.style;for(var k in o)r.setProperty('--'+k.replace(/_/g,'-'),o[k]);}catch(e){}}})();</script>

    <!-- Guacamole JS modules -->
    <script src="/guac/Namespace.js"></script>
    <script src="/guac/Client.js"></script>
    <script src="/guac/Display.js"></script>
    <script src="/guac/Event.js"></script>
    <script src="/guac/InputSink.js"></script>
    <script src="/guac/IntegerPool.js"></script>
    <script src="/guac/Keyboard.js"></script>
    <script src="/guac/KeyEventInterpreter.js"></script>
    <script src="/guac/Layer.js"></script>
    <script src="/guac/Mouse.js"></script>
    <script src="/guac/Parser.js"></script>
    <script src="/guac/Position.js"></script>
    <script src="/guac/Status.js"></script>
    <script src="/guac/Touch.js"></script>
    <script src="/guac/Tunnel.js"></script>
    <script src="/guac/UTF8Parser.js"></script>
    <script src="/guac/InputStream.js"></script>
    <script src="/guac/OutputStream.js"></script>
    <script src="/guac/StringReader.js"></script>
    <script src="/guac/StringWriter.js"></script>

    <script src="/guac/ArrayBufferWriter.js"></script>
    <script src="/guac/BlobReader.js"></script>

    <script src="/guac/DataURIReader.js"></script>
    <script src="/guac/AudioContextFactory.js"></script>
    <script src="/guac/AudioPlayer.js"></script>
    <script src="/guac/AudioRecorder.js"></script>
    <script src="/guac/VideoPlayer.js"></script>
    <script src="/guac/H264Decoder.js"></script>
    <script src="/guac/JSONReader.js"></script>
