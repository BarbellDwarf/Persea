{% extends "layouts/app.html" %}

{% block title %}{{ site_title }} — Documentation{% endblock %}

{% block content %}
<div class="flex gap-8 max-w-7xl mx-auto">
    <!-- Documentation section nav -->
    <aside class="w-56 shrink-0 hidden lg:block">
        <div class="sticky top-6">
            <h3 class="text-xs font-medium text-[var(--text-muted)] uppercase tracking-wider mb-3">Documentation</h3>
            <nav id="toc" class="space-y-1" role="navigation" aria-label="Documentation sections">
                {% for doc in docs %}
                <a href="#{{ doc.slug }}" class="toc-link">{{ doc.title }}</a>
                {% endfor %}
            </nav>
        </div>
    </aside>

    <!-- Main Content -->
    <div class="flex-1 min-w-0 max-w-none">
        {% for doc in docs %}
        <section id="{{ doc.slug }}" class="docs-content mb-12">
            {{ doc.html | safe }}
        </section>
        {% endfor %}
    </div>
</div>

<style>
    /* Markdown-rendered documentation content */
    .docs-content h1,
    .docs-content h2,
    .docs-content h3,
    .docs-content h4 {
        scroll-margin-top: 2rem;
        color: var(--text-primary);
        font-weight: 600;
        line-height: 1.3;
    }
    .docs-content h1 { font-size: 1.5rem; margin: 0 0 1rem; }
    .docs-content h2 { font-size: 1.125rem; margin: 1.5rem 0 0.75rem; padding-bottom: 0.4rem; border-bottom: 1px solid var(--border); }
    .docs-content h3 { font-size: 1rem; margin: 1.25rem 0 0.5rem; }
    .docs-content h4 { font-size: 0.9rem; margin: 1rem 0 0.5rem; }
    .docs-content p { color: var(--text-secondary); margin: 0 0 1rem; line-height: 1.6; }
    .docs-content a { color: var(--accent); text-decoration: none; }
    .docs-content a:hover { text-decoration: underline; }
    .docs-content ul,
    .docs-content ol { color: var(--text-secondary); margin: 0 0 1rem; padding-left: 1.5rem; line-height: 1.6; }
    .docs-content li { margin: 0.25rem 0; }
    .docs-content li > ul,
    .docs-content li > ol { margin-bottom: 0; }
    .docs-content strong { color: var(--text-primary); }
    .docs-content code {
        font-family: var(--font-mono);
        font-size: 0.85em;
        background: var(--bg-input);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 0.1em 0.35em;
        color: var(--text-primary);
    }
    .docs-content pre {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px;
        margin: 0 0 1rem;
        overflow-x: auto;
    }
    .docs-content pre code {
        background: none;
        border: none;
        padding: 0;
        font-size: 0.85rem;
        color: var(--text-secondary);
        line-height: 1.6;
    }
    .docs-content table {
        width: 100%;
        border-collapse: collapse;
        margin: 0 0 1rem;
        font-size: 0.875rem;
        color: var(--text-secondary);
    }
    .docs-content th {
        text-align: left;
        padding: 0.5rem 0.75rem;
        border-bottom: 1px solid var(--border);
        color: var(--text-muted);
        font-weight: 500;
    }
    .docs-content td {
        padding: 0.5rem 0.75rem;
        border-bottom: 1px solid var(--border);
    }
    .docs-content tr:last-child td { border-bottom: none; }
    .docs-content blockquote {
        margin: 0 0 1rem;
        padding: 0.5rem 1rem;
        border-left: 3px solid var(--accent);
        background: var(--bg-card);
        border-radius: 0 8px 8px 0;
        color: var(--text-secondary);
    }
    .docs-content blockquote p { margin-bottom: 0; }
    .docs-content img { max-width: 100%; height: auto; border-radius: 8px; margin: 0 0 1rem; }
    .docs-content hr { border: none; border-top: 1px solid var(--border); margin: 1.5rem 0; }
</style>

<script nonce="{{ csp_nonce }}">
    (function() {
        // TOC active state on scroll
        var links = Array.prototype.slice.call(document.querySelectorAll('.toc-link'));
        var sections = links.map(function(link) {
            return link.getAttribute('href').slice(1);
        });
        function updateToc() {
            var scrollY = window.scrollY + 100;
            var active = sections[0];
            for (var i = sections.length - 1; i >= 0; i--) {
                var el = document.getElementById(sections[i]);
                if (el && el.offsetTop <= scrollY) {
                    active = sections[i];
                    break;
                }
            }
            links.forEach(function(link) {
                link.classList.toggle('active', link.getAttribute('href') === '#' + active);
            });
        }
        window.addEventListener('scroll', updateToc);
        updateToc();
    })();
</script>
{% endblock %}
