<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}persea{% endblock %}</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- Tailwind CSS v3 CDN with inline config -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
    tailwind.config = {
        darkMode: 'class',
        theme: {
            extend: {
                fontFamily: {
                    sans: ['Inter', 'system-ui', 'sans-serif'],
                    mono: ['JetBrains Mono', 'monospace'],
                },
                colors: {
                    brand: {
                        50:'#ecfdf5',100:'#d1fae5',200:'#a7f3d0',300:'#6ee7b7',
                        400:'#34d399',500:'#10b981',600:'#059669',700:'#047857',
                        800:'#065f46',900:'#064e3b',950:'#022c22',
                    },
                    surface: {
                        50:'#f8fafc',100:'#f1f5f9',200:'#e2e8f0',300:'#cbd5e1',
                        400:'#94a3b8',500:'#64748b',600:'#475569',700:'#334155',
                        800:'#1e293b',900:'#0f172a',950:'#020617',
                    },
                },
            },
        },
    }
    </script>

    <!-- htmx -->
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script>
    // Configure htmx to send API key on every request
    htmx.config.defaultHeaders = { 'Authorization': 'Bearer ' + (sessionStorage.getItem('persea_api_key') || '') };
    document.body.addEventListener('htmx:configRequest', function(evt) {
        var key = sessionStorage.getItem('persea_api_key');
        if (key) {
            evt.detail.headers['Authorization'] = 'Bearer ' + key;
        }
    });
    // Global API helper for inline fetch calls
    function apiHeaders() {
        var key = sessionStorage.getItem('persea_api_key');
        return { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + (key || '') };
    }
    </script>

    <!-- Theme detection -->
    <script>
    (function() {
        var s = localStorage.getItem('theme');
        var d = s || (matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light');
        document.documentElement.className = d;
    })();
    </script>

    <style>
        html { transition: background-color 0.2s, color 0.2s; }
        body { font-family: 'Inter', system-ui, sans-serif; }
        .dark ::-webkit-scrollbar { width: 6px; }
        .dark ::-webkit-scrollbar-track { background: #111827; }
        .dark ::-webkit-scrollbar-thumb { background: #374151; border-radius: 3px; }
    </style>

    <!-- App CSS -->
    <link rel="stylesheet" href="/css/app.css">

    {% block head %}{% endblock %}
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen antialiased">
    {% block body %}{% endblock %}

    <!-- Shared JS utilities -->
    <script src="/js/theme.js"></script>
    <script src="/js/utils.js"></script>
    <script>initTheme();</script>
</body>
</html>
