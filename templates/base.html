<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Persea{% endblock %}</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">

    <!-- Google Fonts (vendored) -->
    <style>
    @font-face { font-family: 'Inter'; font-style: normal; font-weight: 300 700; font-display: swap; src: url('/fonts/inter-latin.woff2') format('woff2'); }
    @font-face { font-family: 'JetBrains Mono'; font-style: normal; font-weight: 400 500; font-display: swap; src: url('/fonts/jetbrains-mono-latin.woff2') format('woff2'); }
    </style>

    <!-- Tailwind CSS (pre-built) -->
    <link rel="stylesheet" href="/css/tailwind.min.css">

    <!-- htmx -->
    <script src="/vendor/htmx.min.js"></script>

    <!-- API auth helper (defines apiHeaders, readCookie) -->
    <script src="/js/auth.js"></script>

    <!-- CSRF: patch fetch() so every XHR carries the X-CSRF-Token header -->
    <script nonce="{{ csp_nonce }}">
    (function() {
        var origFetch = window.fetch;
        window.fetch = function(input, init) {
            init = init || {};
            var headers = init.headers || {};
            if (headers instanceof Headers) {
                if (!headers.has('X-CSRF-Token')) {
                    var t = readCookie('csrf_token');
                    if (t) headers.set('X-CSRF-Token', t);
                }
            } else {
                var has = false;
                for (var k in headers) {
                    if (k.toLowerCase() === 'x-csrf-token') { has = true; break; }
                }
                if (!has) {
                    var t = readCookie('csrf_token');
                    if (t) headers['X-CSRF-Token'] = t;
                }
            }
            init.headers = headers;
            return origFetch(input, init);
        };
    })();
    </script>

    <!-- Theme detection -->
    <script nonce="{{ csp_nonce }}">
    (function() {
        var s = localStorage.getItem('theme');
        var mq = window.matchMedia('(prefers-color-scheme: dark)');
        if (!s || s === 'auto') {
            document.documentElement.classList.add(mq.matches ? 'dark' : 'light');
        } else {
            document.documentElement.classList.add(s);
        }
    })();
    </script>

    <style>
        html { transition: background-color 0.2s, color 0.2s; }
        body { font-family: 'Inter', system-ui, sans-serif; }
        .dark ::-webkit-scrollbar { width: 6px; }
        .dark ::-webkit-scrollbar-track { background: #111827; }
        .dark ::-webkit-scrollbar-thumb { background: #374151; border-radius: 3px; }
    </style>

    <!-- App CSS -->
    <link rel="stylesheet" href="/css/app.css?v=1.1.2">

    {% block head %}{% endblock %}
</head>
<body class="min-h-screen antialiased">
    {% block body %}{% endblock %}

    <!-- Shared JS utilities -->
    <script src="/js/theme.js?v=1.1.2"></script>
    <script src="/js/utils.js?v=1.1.2"></script>
    <script nonce="{{ csp_nonce }}">
    // Configure htmx to send API key + CSRF token on every request
    htmx.config.defaultHeaders = {
        'Authorization': 'Bearer ' + (sessionStorage.getItem('persea_api_key') || ''),
        'X-CSRF-Token': (function() {
            var parts = document.cookie.split(';');
            for (var i = 0; i < parts.length; i++) {
                var part = parts[i].trim();
                if (part.indexOf('csrf_token=') === 0) return decodeURIComponent(part.substring(11));
            }
            return '';
        })()
    };
    document.body.addEventListener('htmx:configRequest', function(evt) {
        var key = sessionStorage.getItem('persea_api_key');
        if (key) {
            evt.detail.headers['Authorization'] = 'Bearer ' + key;
        }
        var csrf = readCookie('csrf_token');
        if (csrf) {
            evt.detail.headers['X-CSRF-Token'] = csrf;
        }
    });
    </script>
    <script nonce="{{ csp_nonce }}">
    fetch('/api/auth/status', { credentials: 'same-origin' })
        .then(function(r) { return r.ok ? r.json() : null; })
        .then(function(d) { if (d && d.theme) initTheme(d.theme); })
        .catch(function() {});
    </script>

    {% if features.desktop_bridge %}
    {% include "partials/desktop_bridge.html" %}
    {% endif %}
</body>
</html>
