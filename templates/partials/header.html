{% if is_admin %}
<div id="update-banner" class="alert alert-success" style="display:none;margin-bottom:0">
    <span id="update-banner-text"></span>
    <a id="update-banner-link" href="#" target="_blank" rel="noopener noreferrer" style="margin-left:8px">View release</a>
    <button id="update-banner-dismiss" type="button" class="btn btn-sm" style="margin-left:auto">Dismiss</button>
</div>
{% endif %}
<header class="header">
    <div style="display:flex;align-items:center;gap:8px">
        <button class="hamburger" id="hamburger-btn" aria-label="Toggle navigation">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"/>
            </svg>
        </button>
    </div>
    <div class="header-actions">
        <button id="theme-toggle" class="btn btn-sm" style="padding:6px 10px;display:flex;align-items:center;gap:4px" title="Theme: Auto (click to cycle)">
            <span class="theme-icon"></span>
        </button>
        <a href="/auth/logout" class="btn btn-sm btn-danger" style="padding:6px 12px;font-size:12px">Logout</a>
    </div>
</header>

<script nonce="{{ csp_nonce }}">
document.getElementById('theme-toggle')?.addEventListener('click', function() {
    if (typeof toggleTheme === 'function') toggleTheme();
});

// ── Mobile hamburger menu ──
(function() {
    var btn = document.getElementById('hamburger-btn');
    var sidebar = document.querySelector('.sidebar');
    var overlay = document.createElement('div');
    overlay.className = 'sidebar-overlay';
    document.body.appendChild(overlay);

    function closeSidebar() {
        sidebar.classList.remove('open');
        overlay.classList.remove('active');
    }

    btn?.addEventListener('click', function() {
        sidebar.classList.toggle('open');
        overlay.classList.toggle('active');
    });

    overlay.addEventListener('click', closeSidebar);

    // Close on nav item click (mobile)
    sidebar?.querySelectorAll('.nav-item').forEach(function(item) {
        item.addEventListener('click', function() {
            if (window.innerWidth <= 768) closeSidebar();
        });
    });
})();

// ── Sidebar collapse toggle ──
(function() {
    var btn = document.getElementById('sidebar-toggle');
    var sidebar = document.getElementById('app-sidebar');
    if (btn && sidebar) {
        var suppressHoverTimer = null;
        btn.addEventListener('click', function() {
            sidebar.classList.toggle('collapsed');
            var icon = btn.querySelector('svg');
            if (icon) icon.style.transform = sidebar.classList.contains('collapsed') ? 'rotate(180deg)' : '';
            // Clicking collapse while the mouse is still over the sidebar
            // would otherwise trigger :hover expansion in the same instant,
            // making the click look like it did nothing. Briefly suppress
            // hover-expand so the collapse is visible before hover can kick
            // back in — the user has to actually move the mouse away and
            // back for hover-to-peek to re-engage, same as most apps that
            // use this pattern.
            if (sidebar.classList.contains('collapsed')) {
                sidebar.classList.add('just-collapsed');
                clearTimeout(suppressHoverTimer);
                suppressHoverTimer = setTimeout(function() {
                    sidebar.classList.remove('just-collapsed');
                }, 600);
            }
        });
        if (window.innerWidth < 1400) sidebar.classList.add('collapsed');
    }
})();
// ── Version update banner (admin pages only; markup gated on is_admin) ──
(function() {
    var banner = document.getElementById('update-banner');
    if (!banner) return;
    var dismissKey = null;
    document.getElementById('update-banner-dismiss')?.addEventListener('click', function() {
        if (dismissKey) localStorage.setItem(dismissKey, '1');
        banner.style.display = 'none';
    });
    fetch('/api/auth/status', { credentials: 'same-origin' })
        .then(function(r) { return r.json(); })
        .then(function(data) {
            if (!data.update_available || !data.latest_version) return;
            dismissKey = 'persea_update_dismissed_' + data.latest_version;
            if (localStorage.getItem(dismissKey)) return;
            document.getElementById('update-banner-text').textContent = 'Persea ' + data.latest_version + ' is available';
            document.getElementById('update-banner-link').href = 'https://github.com/persea-grove/persea/releases/tag/v' + data.latest_version;
            banner.style.display = 'flex';
        })
        .catch(function() { /* offline: banner stays hidden */ });
})();
</script>
