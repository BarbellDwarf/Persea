<header class="header">
    <div style="display:flex;align-items:center;gap:8px">
        <button class="hamburger" id="hamburger-btn" aria-label="Toggle navigation">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"/>
            </svg>
        </button>
        <div class="header-title">Persea</div>
    </div>
    <div class="header-actions">
        <button id="theme-toggle" class="btn btn-sm" style="padding:6px 10px" title="Toggle theme">
            <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
            </svg>
        </button>
        <a href="/auth/logout" class="btn btn-sm btn-danger" style="padding:6px 12px;font-size:12px">Logout</a>
    </div>
</header>

<script>
document.getElementById('theme-toggle')?.addEventListener('click', function() {
    if (typeof toggleTheme === 'function') toggleTheme();
});

// ── Mobile hamburger menu ──
(function() {
    var btn = document.getElementById('hamburger-btn');
    var sidebar = document.querySelector('.sidebar');
    var overlay = document.createElement('div');
    overlay.className = 'sidebar-overlay';
    document.body.appendChild(overlay);

    function closeSidebar() {
        sidebar.classList.remove('open');
        overlay.classList.remove('active');
    }

    btn?.addEventListener('click', function() {
        sidebar.classList.toggle('open');
        overlay.classList.toggle('active');
    });

    overlay.addEventListener('click', closeSidebar);

    // Close on nav item click (mobile)
    sidebar?.querySelectorAll('.nav-item').forEach(function(item) {
        item.addEventListener('click', function() {
            if (window.innerWidth <= 768) closeSidebar();
        });
    });
})();
</script>
