# persea — example configuration
#
# All settings are optional and have sensible defaults.
# Copy this file to config.toml and adjust as needed.
#
# Usage:
#   persea --config config.toml serve
#
# ─── Windows ─────────────────────────────────────────────────────────────────
# The installer (`persea-setup.exe`) runs `persea --init`, which generates a
# starter config at %ProgramData%\persea\config.toml and a self-signed TLS
# certificate in %ProgramData%\persea\tls. The service picks that config up
# automatically. Use forward slashes or escaped backslashes ("C:\\persea\...")
# in path values: plain backslashes are invalid TOML escapes.

# ─── Server ───────────────────────────────────────────────────────────────────

# Address and port to listen on.
# Default: "127.0.0.1:8089" (loopback only — safe for development).
# For production behind a reverse proxy, use "127.0.0.1:8089".
# To listen on all interfaces: "0.0.0.0:443" (with TLS) or "0.0.0.0:8089".
# Env: PERSEA_LISTEN_ADDR
listen_addr = "127.0.0.1:8089"

# Address of the guacd daemon (Guacamole protocol server).
# Default: "127.0.0.1:4822"
# Env: PERSEA_GUACD_ADDR
guacd_addr = "127.0.0.1:4822"

# Directory for session recording files (.guac format).
# Default: "./recordings"
# DEPRECATED: use [recording] section below. Kept for backwards compatibility.
# recording_path = "./recordings"

# Directory containing static web files (HTML, JS, CSS).
# Default: "./static"
# Env: PERSEA_STATIC_PATH
static_path = "./static"

# Path to the SQLite database (admins, OIDC users, auth sessions).
# Default: "./persea.db"
# Env: PERSEA_DB_PATH
# Used only when db_url (below) is NOT set — "legacy mode".
db_path = "./persea.db"

# Optional: use a managed database backend instead of the SQLite file above.
# When set, the SQLx pool IS the store: ALL app data (users, connections,
# address book, session history, audit log, system settings, auth providers)
# lives in this backend. The schema migrations (migrations/<backend>/*.sql)
# run automatically at startup, and `db_path` is ignored for data.
#
# Supported schemes:
#   db_url = "postgres://user:password@dbhost:5432/persea"
#   db_url = "mysql://user:password@dbhost:3306/persea"
#   db_url = "sqlite:///opt/persea/data/persea.db?mode=rwc"
#
# The database user needs CREATE/DDL privileges (migrations run at startup).
# Connection parameters (TLS, pool size) go in the URL, e.g.
# postgres://user:password@dbhost:5432/persea?sslmode=require
#
# The setup wizard can enter this URL at first run — the first admin is then
# created directly in the configured backend, no SQLite intermediate step.
#
# Env: PERSEA_DB_URL

# ─── Enterprise HA ────────────────────────────────────────────────────────
#
# These two keys matter only for multi-instance deployments sharing one
# db_url backend. Single-instance deployments can ignore them.

# Stable identifier for this instance. Used by the shared session registry
# to mark which instance owns each live session; the reaper and recording
# rotation only ever operate on sessions/files this instance owns.
# Must be unique across the fleet (two instances may NOT share an id).
# Default: "<hostname>-<pid>" — unique even when several instances run on
# the same host, but changes across restarts (set a stable value per host
# if per-instance recording rotation must follow a restarted instance).
# Env: PERSEA_INSTANCE_ID
# instance_id = "persea-1"

# Public base URL of this instance (scheme + host + port), as reachable from
# the other instances/browsers, e.g. "https://persea-1.example.com" or
# "http://127.0.0.1:8096". When a session created here is joined or shadowed
# from another instance, the browser is redirected to this URL so THIS
# instance can serve the guacd stream (the guacd connection lives here).
# Unset: cross-instance joins to this instance's sessions are rejected with
# a clear error (the sessions are still listed on other instances).
# Env: PERSEA_HA_BASE_URL
# ha_base_url = "https://persea-1.example.com"

# Title shown in the browser tab and page header.
# Default: "persea"
# Env: PERSEA_SITE_TITLE
site_title = "Persea"

# ─── Session Timeouts ─────────────────────────────────────────────────────────

# Seconds before a pending session expires (no WebSocket connection yet).
# Default: 60
# Env: PERSEA_SESSION_PENDING_TIMEOUT_SECS
session_pending_timeout_secs = 60

# Maximum duration for active sessions in seconds.
# Sessions running longer than this are automatically terminated.
# Default: 28800 (8 hours). Set to 0 to disable.
# Env: PERSEA_SESSION_MAX_DURATION_SECS
session_max_duration_secs = 28800

# Idle timeout for active sessions in seconds. Sessions whose last client
# activity is older than this are terminated (status "idle-timeout" in the
# session history). Client tunnel keepalive pings do NOT count as activity,
# so a live-but-silent session is still reaped. Set to 0 to disable idle
# reaping (max duration still applies).
# Default: 1800 (30 minutes)
# Env: PERSEA_SESSION_IDLE_TIMEOUT_SECS
session_idle_timeout_secs = 1800

# OIDC auth session TTL in seconds. After this period, users must
# re-authenticate via their identity provider.
# Default: 86400 (24 hours)
# Env: PERSEA_AUTH_SESSION_TTL_SECS
# auth_session_ttl_secs = 86400

# ─── Password Policy ─────────────────────────────────────────────────────────

# Enforced wherever a password is set: the admin users API, the CLI
# `create-user` command, and the account password-change endpoint.
# The setup wizard's first-admin password is not policy-checked.

# [password]
# Minimum password length in characters. Default: 15.
# Env: PERSEA_PASSWORD__MIN_LENGTH
# min_length = 15
#
# How many recent password hashes to keep per user. A new password matching
# any of the last `history` passwords is rejected. Default: 5. Set to 0 to
# disable reuse checking. Hashes are stored in the `password_history` table
# (created by the per-backend migrations; legacy SQLite creates it on first
# use).
# Env: PERSEA_PASSWORD__HISTORY
# history = 5

# ─── Session Limits ──────────────────────────────────────────────────────────

# Maximum concurrent sessions (all types). Default: 500. Set to 0 for unlimited.
# Env: PERSEA_MAX_SESSIONS
# max_sessions = 500

# Maximum concurrent sessions per user. Default: 50. Set to 0 for unlimited.
# Env: PERSEA_MAX_SESSIONS_PER_USER
# max_sessions_per_user = 50

# Seconds to keep completed sessions in memory before cleanup.
# Session history in SQLite is not affected. Default: 300 (5 minutes).
# Env: PERSEA_SESSION_CLEANUP_DELAY_SECS
# session_cleanup_delay_secs = 300

# How many days to retain session history in the database. Default: 90.
# Set to 0 to keep history forever.
# Env: PERSEA_SESSION_HISTORY_RETENTION_DAYS
# session_history_retention_days = 90

# Enable API rate limiting. Default: false.
# When behind a reverse proxy (HAProxy, nginx) or access gateway (KnockNoc),
# rate limiting is typically handled upstream and not needed here.
# Env: PERSEA_RATE_LIMIT
# rate_limit = false

# ─── Browser Sessions (Xvnc + Chromium) ──────────────────────────────────────

# Path to the Xvnc binary (from tigervnc-standalone-server).
# Default: "Xvnc"
# Env: PERSEA_XVNC_PATH
xvnc_path = "Xvnc"

# Path to the Chromium binary.
# Default: "chromium"
# Env: PERSEA_CHROMIUM_PATH
chromium_path = "chromium"

# X display number range for Xvnc instances.
# Each web browser session gets its own display (:100 = port 6100, etc.).
# Default: 100–199 (up to 100 concurrent web sessions).
# Env: PERSEA_DISPLAY_RANGE_START / PERSEA_DISPLAY_RANGE_END
display_range_start = 100
display_range_end = 199

# Chrome DevTools Protocol port range for headless Chromium instances.
# Default: 9200–9299.
# Env: PERSEA_CDP_PORT_RANGE_START / PERSEA_CDP_PORT_RANGE_END
# cdp_port_range_start = 9200
# cdp_port_range_end = 9299

# Timeout (seconds) for login scripts executed on SSH sessions.
# Default: 120
# Env: PERSEA_LOGIN_SCRIPT_TIMEOUT_SECS
# login_script_timeout_secs = 120

# Directory containing login scripts for SSH sessions.
# Default: "/opt/persea/scripts"
# Env: PERSEA_LOGIN_SCRIPTS_DIR
# login_scripts_dir = "/opt/persea/scripts"

# ─── Connection Allowlists (CIDR) ────────────────────────────────────────────
#
# Control which hosts sessions can connect to. Each is a list of CIDR ranges.
# Hostnames are resolved and checked against the allowlist.
# Default for all four: ["127.0.0.0/8", "::1/128"] (loopback only). The
# private ranges in the examples below are explicit opt-ins — nothing outside
# loopback is reachable unless you add it.

# SSH session targets
# Env: PERSEA_SSH_ALLOWED_NETWORKS (use double underscore for nested values)
ssh_allowed_networks = ["127.0.0.0/8", "::1/128", "10.0.0.0/8", "192.168.0.0/16"]

# When true, SSH sessions start under a tmux wrapper
# (`tmux attach-session -d || tmux new-session`) instead of a plain shell.
# On reconnect, `-d` kicks any stale client a dead connection left attached,
# so the user never lands on a frozen tmux screen. Off by default.
# Env: PERSEA_SSH_TMUX_DETACH
# ssh_tmux_detach = false

# RDP session targets
# Env: PERSEA_RDP_ALLOWED_NETWORKS
rdp_allowed_networks = ["127.0.0.0/8", "::1/128", "10.0.0.0/8", "192.168.0.0/16"]

# VNC session targets
# Env: PERSEA_VNC_ALLOWED_NETWORKS
# vnc_allowed_networks = ["127.0.0.0/8", "::1/128", "10.0.0.0/8", "192.168.0.0/16"]

# Web browser session URL hosts
# Use ["0.0.0.0/0", "::/0"] to allow any host.
# Env: PERSEA_WEB_ALLOWED_NETWORKS
web_allowed_networks = ["127.0.0.0/8", "::1/128"]

# ─── Trusted Proxies ────────────────────────────────────────────────────────
#
# CIDRs of reverse proxies whose X-Forwarded-For header should be trusted.
# When a connection comes from a trusted proxy, the first IP in
# X-Forwarded-For is used as the client IP in audit logs and rate limiting.
# Default: [] (empty — always use socket address)
# Env: PERSEA_TRUSTED_PROXIES

# trusted_proxies = ["127.0.0.0/8", "::1/128"]

# Default scope for new per-user credential variables when multiple Vault
# backends are configured: "local" (default — stays on this instance) or
# "shared" (propagates fleet-wide). Ignored with a single Vault.
# Env: PERSEA_USER_CREDENTIALS_DEFAULT_SCOPE
# user_credentials_default_scope = "local"

# ─── TLS ──────────────────────────────────────────────────────────────────────
#
# Enables HTTPS for clients and optionally TLS for the guacd connection.
# Omit the entire [tls] section to run plain HTTP (for development or
# when behind a TLS-terminating reverse proxy).
# WARNING: persea will log a warning at startup when [tls] is not configured
# because credentials and session tokens travel unencrypted.
#
# Generate a self-signed cert:
#   persea generate-cert --hostname your-hostname.example.com --out-dir ./tls

# [tls]
# # HTTPS certificate and private key
# cert_path = "/opt/persea/tls/cert.pem"
# key_path = "/opt/persea/tls/key.pem"
#
# # Trust this certificate for the guacd TLS connection (optional).
# # When set, persea connects to guacd over TLS.
# # The same self-signed cert can serve both purposes.
# # Omit for plain TCP to guacd.
# guacd_cert_path = "/opt/persea/tls/cert.pem"
#
# # Set this to false if cert_path/key_path point at a self-signed
# # certificate (e.g. generated with `persea generate-cert`). Browsers
# # refuse to send Secure-flagged cookies over a connection with an
# # invalid/untrusted certificate — even after you click through the
# # warning — which breaks login entirely if this stays true. install.sh
# # and the Docker image both set this automatically when they generate
# # their own self-signed cert; set it by hand if you generated or
# # supplied the cert yourself. Leave as true (the default) for a real
# # CA-issued certificate.
# secure_cookies = true

# ─── OIDC (Single Sign-On) ───────────────────────────────────────────────────
#
# Enables OpenID Connect authentication. Works with any OIDC provider:
# Authentik, Keycloak, Okta, Azure AD, Google, etc.
#
# The client_secret can also be set via the OIDC_CLIENT_SECRET environment
# variable, which takes precedence over this config file. Recommended for
# production (Docker secrets, systemd EnvironmentFile, etc.).
#
# When OIDC is configured, the web UI shows a login button. API key auth
# continues to work alongside OIDC.

# [oidc]
# issuer_url = "https://authentik.example.com/application/o/persea/"
# client_id = "your-client-id"
# client_secret = "your-client-secret"   # or set OIDC_CLIENT_SECRET env var
# redirect_uri = "https://your-host/auth/callback"
#
# # Role assigned to new users on first login.
# # Options: "admin", "poweruser", "operator", "viewer"
# # Default: "operator"
# default_role = "operator"
#
# # OIDC claim name containing group memberships (default: "groups").
# groups_claim = "groups"
#
# # Extra OIDC scopes to request beyond openid/email/profile.
# extra_scopes = ["groups"]
#
# # Custom CA certificate (PEM) for verifying the OIDC provider.
# # Use this when your IdP uses a private or internal CA not in the system trust store.
# # ca_cert = "/etc/ssl/private/internal-ca.pem"
#
# # Skip TLS certificate verification for OIDC connections (default: false).
# # WARNING: Only use for debugging — exposes client_secret and tokens to MITM attacks.
# # tls_skip_verify = false

# ─── Storage ────────────────────────────────────────────────────────────────
#
# Controls the address book (connections) storage backend.
# When backend = "db" (default), all connection entries and credentials are
# stored in the database with AES-256-GCM encryption. No Vault required.
# When backend = "vault", credentials are stored in Vault; metadata stays in DB.

# [storage]
# backend = "db"   # "db" (default) or "vault"
# # encryption_key for DB-stored credentials. Required when backend = "db":
# # persea refuses to start without it.
# # Generate with: openssl rand -hex 32
# # Can also be set via PERSEA_STORAGE_KEY env var.
# encryption_key = ""

# ─── Vault / Address Book ──────────────────────────────────────────────────
#
# Optional external secrets store for address book credentials.
# When [storage].backend = "vault", Vault is used for credential storage.
# When [storage].backend = "db" (default), Vault is not needed for connections.
#
# Connection entries (SSH, RDP, Web) are stored in HashiVault or OpenBao KV v2.
# Credentials never reach the browser — the server reads them from Vault and
# creates sessions directly.
#
# Authentication uses AppRole. The secret_id is provided via the
# VAULT_SECRET_ID environment variable.
#
# Vault KV v2 path structure:
#   <base_path>/shared/<folder>/<entry>          — shared across instances
#   <base_path>/instance/<name>/<folder>/<entry>  — instance-specific
#   <folder>/.config — folder metadata (allowed_groups, description)

# [vault]
# addr = "https://vault.example.com:8200"
# mount = "secret"            # KV v2 mount (default: "secret")
# base_path = "persea"      # base path under mount (default: "persea")
# role_id = "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
# # namespace = "my-ns"       # optional, Vault Enterprise / OpenBao namespaces
# # instance_name = "prod-1"  # optional, enables instance-scoped entries
# # tls_skip_verify = false   # skip TLS cert verification (dev only, default: false)

# [vault_shared]
# Optional dedicated backend for the `shared` scope — e.g. a central Vault
# shared across the fleet. When set, shared-scope folders/entries route here
# instead of [vault]. Secret ID via VAULT_SHARED_SECRET_ID env var.
# addr = "https://vault-central.example.com:8200"
# mount = "secret"            # KV v2 mount (default: "secret")
# base_path = "persea"      # base path under mount (default: "persea")
# role_id = "yyyyyyyy-yyyy-yyyy-yyyy-yyyyyyyyyyyy"
# # namespace = "my-ns"       # optional, Vault Enterprise / OpenBao namespaces
# # tls_skip_verify = false   # skip TLS cert verification (dev only, default: false)

# [vault_local]
# Optional dedicated backend for the `instance` (local) scope — e.g. a per-host
# Vault that stays reachable during a central outage. When set, instance-scope
# folders/entries route here instead of [vault]. Set instance_name to the value
# data was originally stored under. Secret ID via VAULT_LOCAL_SECRET_ID env var.
# addr = "https://127.0.0.1:8200"
# mount = "secret"            # KV v2 mount (default: "secret")
# base_path = "persea"      # base path under mount (default: "persea")
# role_id = "zzzzzzzz-zzzz-zzzz-zzzz-zzzzzzzzzzzz"
# instance_name = "prod-1"    # must match the name data was stored under
# # namespace = "my-ns"       # optional, Vault Enterprise / OpenBao namespaces
# # tls_skip_verify = false   # skip TLS cert verification (dev only, default: false)

# ─── Recording ──────────────────────────────────────────────────────────────
#
# Controls session recording and automatic rotation.
# If omitted, recordings are enabled with no automatic cleanup.
# The path can also be set via the top-level recording_path key
# (the [recording] section takes precedence).

# [recording]
# path = "./recordings"              # recording directory (default: "./recordings")
# enabled = true                     # master switch (default: true)
# max_disk_percent = 80              # delete oldest when disk usage exceeds % (0 = disable)
# max_recordings = 1000              # global max recording count (0 = unlimited)
# rotation_interval_secs = 300       # how often to check rotation (seconds, default: 300)

# ─── VDI (Docker Container Sessions) ───────────────────────────────────────
#
# Ephemeral per-user Docker desktop containers. Each user gets an isolated
# Linux desktop accessible via RDP through guacd. Containers persist for
# idle_timeout_mins after disconnect for quick reconnect.
#
# Requires: persea user in docker group for socket access.
# Test image: contrib/vdi-test-image/ (Debian trixie + xrdp + xfce4)

# [vdi]
# enabled = false
# docker_socket = "/var/run/docker.sock"
# default_cpu_limit = 1.0               # CPU cores (Docker --cpus)
# default_memory_limit = 512            # Memory limit in MB (Docker --memory)
# ready_timeout_secs = 30               # max wait for container ready
# idle_timeout_mins = 60                # destroy after idle period
# allowed_images = []                    # empty = allow all images
# home_base = "/opt/persea/vdi"        # base dir for user home mounts

# ─── Theme ────────────────────────────────────────────────────────────────────
#
# Customize the web UI appearance. Pick a built-in preset and optionally
# override individual colors. Users can switch themes in the browser via
# the theme switcher (persisted in localStorage).
#
# Built-in presets: aurora (default), dark, light, high-contrast, terminal,
# nord, corporate, jaguar
#
# All color values are CSS color strings (hex, rgb(), hsl(), named colors).

# [theme]
# preset = "aurora"                 # built-in preset to use as the base
# logo_url = "/logo.svg"            # custom logo URL (shown on login + nav)
#
# # Override individual colors on top of the preset:
# # primary_color = "#e94560"
# # accent_color = "#5bc0be"
# # bg_color = "#1a1a2e"
# # surface_color = "#16213e"
# # text_color = "#e0e0e0"
# # text_muted = "#aaa"
# # border_color = "#333"
# # input_color = "#0f3460"
# # primary_hover = "#c73652"
# # accent_hover = "#4aa3a1"
# # text_dim = "#888"
# # text_on_primary = "#fff"
# # btn_disabled = "#555"
# # status_pending = "#f0c040"
# # status_active = "#5bc0be"
# # status_completed = "#888"
# # status_error = "#e94560"
# # status_expired = "#666"

# ─── Drive / File Transfer ──────────────────────────────────────────────────
#
# Enables file transfer for RDP (drive redirection) and SSH (SFTP) sessions.
#
# RDP: A per-session directory under drive_path is mounted as a virtual drive
#      visible in the remote Windows session (e.g. "Shared Drive" in Explorer).
# SSH: SFTP file transfer directly between browser and target SSH server.
#      No files stored on the persea server for SSH sessions.
#
# SECURITY: For RDP drive storage, use the LUKS options below to encrypt the
# drive_path volume. The encryption key is stored in Vault and the volume is
# only unlocked while persea is running.

# [drive]
# enabled = true
# drive_path = "/mnt/persea-drives"   # mount point / base dir for per-session storage
# drive_name = "Shared Drive"           # name shown in remote RDP session
# allow_download = true                 # allow downloading files from remote
# allow_upload = true                   # allow uploading files to remote
# cleanup_on_close = true               # delete session drive dir on session end
# retention_secs = 0                    # delay before cleanup (0 = immediate)
#
# # LUKS encryption (optional, requires Vault)
# # The install script can set this up interactively.
# luks_device = "/opt/persea/drives.luks"    # LUKS container file
# luks_name = "persea-drives"                # device-mapper name
# luks_key_path = "persea/luks-key"          # Vault KV path for encryption key

# ─── RDP Protocol Settings ──────────────────────────────────────────────────
#
# Applied to every RDP session unless the address book entry (or the
# ad-hoc connect request) overrides the same field.
#
# default_auth_pkg: NLA/CredSSP authentication package. Persea
# defaults to "ntlm" because Kerberos requires a KDC reachable via
# DNS (usually over TCP) and its failure mode is a silent hang.
# Set to "kerberos" if you actually run AD-integrated hosts with
# Kerberos working. "negotiate" means Kerberos-first with NTLM
# fallback and is also prone to the silent-hang failure mode.
# Leave commented to accept the "ntlm" default.

# [rdp]
# default_auth_pkg = "ntlm"

# ─── VMware vSphere ─────────────────────────────────────────────────────────
#
# Enables vSphere integration for VM inventory and OS-aware protocol routing.
# Connects to vCenter via the vSphere REST API (vSphere 7.03+) to list VMs
# and auto-detect the right Guacamole protocol (RDP for Windows, SSH for Linux,
# VNC for everything else).
#
# Credentials are read from environment variables (not stored in config).
# guacd connects directly to the guest IP address.

# [vsphere]
# vcenter_addr = "https://vcenter.example.com/sdk"
# username = "administrator@vsphere.local"
# password_env = "VSPHERE_PASSWORD"    # env var holding the password (default)
# insecure = false                     # skip TLS cert verification (default)
# refresh_interval_secs = 300          # VM inventory refresh interval (default: 5 min)
#
# # Optional per-VM credential overrides (keyed by VM name or ID).
# # When set, these credentials override the global username/password for that VM.
# [vsphere.vm_credentials]
# "my-windows-server" = { username = "Administrator", password_env = "WIN_PASS" }
# "my-linux-box" = { username = "root", password_env = "LINUX_PASS" }

# ─── Desktop Shell Bridge ────────────────────────────────────────────────────
#
# The persea desktop app (Tauri) can talk to this instance over remote IPC:
# Win-key injection, drag-drop file transfer, and session window commands.
# This is OFF by default, because enabling it widens the page's CSP:
# `connect-src` additionally permits the Tauri IPC transports
# (`tauri://localhost` on macOS/Linux, `http://ipc.localhost` on Windows).
# When the flag is on, every page also serves the desktop bridge script
# (templates/partials/desktop_bridge.html); it stays inert in a normal
# browser (it only activates when the Tauri webview granted remote IPC).
#
# SECURITY: the desktop app grants IPC only to the origins you allowlist in
# its `dangerousRemoteDomainIpcAccess` capability — remote pages get IPC
# ONLY for those allowlisted origins, and only the `core:event` command
# group. Leave this flag off for plain-browser deployments.

# [desktop]
# allow_bridge = false    # Env: PERSEA_DESKTOP__ALLOW_BRIDGE

# [session]
# Session behaviour.
#
# reason_required: when true, every session creation (the Connections page
# connect flow and the Sessions page ad-hoc form) must carry a connection
# reason (dropdown: Maintenance / Password rotation / Troubleshooting /
# Incident response / Configuration change / Data migration / Performance
# testing / Security audit / Other, plus free text). Creation without a
# reason is rejected with a 400 and a clear message. Reasons are stored in
# session_history.reason and shown on the Sessions page and in reports.
# Default: false (reasons stay optional).
# reason_required = false    # Env: PERSEA_SESSION__REASON_REQUIRED

# [updates]
# Server version update checking. Every `check_interval_hours`, persea
# fetches `check_url` (the unauthenticated GitHub Releases API by default)
# and compares the latest release against the running version. When a newer
# stable release exists, admins see a dismissible banner ("Persea X.Y.Z is
# available") with a link to the release. The check runs in the background;
# a failure is logged as a warning and retried at the next interval.
#
# AIR-GAPPED DEPLOYMENTS: set enabled = false. No network call is made at
# all, and the banner / status endpoint report nothing. Alternatively, keep
# it enabled and point check_url at an internal mirror that implements the
# same `/releases/latest` shape (e.g. Gitea).
# enabled = true     # Env: PERSEA_UPDATES__ENABLED
# check_url = "https://api.github.com/repos/persea-grove/persea/releases/latest"
#                     # Env: PERSEA_UPDATES__CHECK_URL
# check_interval_hours = 24    # Env: PERSEA_UPDATES__CHECK_INTERVAL_HOURS
