[package]
name = "persea"
version = "1.0.2"
edition = "2021"
description = "Lightweight Rust replacement for Apache Guacamole client"
license = "Apache-2.0"

[dependencies]
# Web framework
axum = { version = "0.8", features = ["ws", "multipart"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["fs", "cors", "trace"] }

# Async runtime
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "net", "io-util", "time", "signal", "process", "fs"] }
tokio-util = "0.7"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Streaming
futures-util = "0.3"
# futures-executor's block_on drives a future without a tokio runtime
# context on the thread, which the ldap3 sync client needs (it creates its
# own runtime internally). Used by the login handlers and the LDAP tests.
futures = "0.3"
bytes = "1"
multer = "3"

# Config
toml = "1"
config = "0.15"

# Version comparison for the update check (already in the tree via rustc_version)
semver = "1"

# Crypto/random
rand = "0.10"
hex = "0.4"
sha2 = "0.11"
subtle = "2"
aes = "0.9"
cbc = "0.2"
aes-gcm = "0.11"
pbkdf2 = { version = "0.13", default-features = false }
hmac = "0.13"
sha1 = "0.11"
md-5 = "0.11"

# Database
rusqlite = { version = "0.35", features = ["bundled"] }
sqlx = { version = "0.9.0", features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "mysql",
    "sqlite",
    "any",
    "migrate",
    "macros",
    "uuid",
    "chrono",
    "json",
] }

# CLI
clap = { version = "4.6.6", features = ["derive"] }

# IP matching
ipnetwork = "0.21"
local-ip-address = "0.6"

# TLS
axum-server = { version = "0.8", features = ["tls-rustls"] }
rcgen = "0.14"
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
# Pure-Rust X.509 parsing for the Security page's TLS certificate tab
# (subject/issuer/expiry metadata from the PEM cert file).
x509-parser = "0.18"

# OIDC
openidconnect = "4"
url = "2"
tower-cookies = "0.11"

# SSH key generation
ssh-key = { version = "0.6", features = ["ed25519"] }

# Rate limiting
tower_governor = "0.8"

# Base64 decoding (JWT payload for OIDC groups)
base64 = "0.23.1"

# HTTP client (Vault API)
reqwest = { version = "0.12", features = ["json", "rustls-tls-native-roots", "cookies"], default-features = false }
webpki-roots = "1"

# SSH tunneling (jump host / bastion)
russh = "0.62"

# Docker (VDI container management)
bollard = "0.21"

# LUKS drive management (uid/gid for chown)
libc = "0.2"

# Socket-level options (TCP keepalive)
socket2 = "0.6"

# URL encoding/decoding (quick-connect redirect)
urlencoding = "2"
serde_urlencoded = "0.7"

# Unified error handling
thiserror = "2"

# Templates
minijinja = "2.23.0"

# Auth provider architecture
async-trait = "0.1"
bitflags = "2"

# SAML 2.0
quick-xml = "0.41"
ring = "0.17"
flate2 = "1"
ldap3 = { version = "0.12", default-features = false, features = ["sync", "tls-rustls-ring"] }

# TOTP MFA
totp-rs = { version = "6.0.0", features = ["otpauth", "qr", "gen_secret"] }

# Password hashing (Argon2id)
argon2 = "0.5"

# Memory zeroize for sensitive data
zeroize = "1"
dns-lookup = "3"
rpassword = "7.5.4"

[target.'cfg(windows)'.dependencies]
# Native Windows service support (install/uninstall/run under the SCM)
windows-service = "0.8"
# Disk-space probe for recording rotation (GetDiskFreeSpaceExW); the
# windows-sys version windows-service already locks.
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }

[dev-dependencies]
proptest = "1"
# Already in the dependency tree via axum's ws feature (locked at 0.29.0) —
# used only by the teardown integration tests' WebSocket client. No new
# crates enter the lock.
tokio-tungstenite = "0.30"

[build-dependencies]
pulldown-cmark = "0.13"
regex = "1"
