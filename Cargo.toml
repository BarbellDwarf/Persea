[package]
name = "rustguac"
version = "1.10.0"
edition = "2021"
description = "Lightweight Rust replacement for Apache Guacamole client"

[dependencies]
# Web framework
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["fs", "cors", "trace"] }

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Streaming
futures-util = "0.3"

# Config
toml = "1"

# Crypto/random
rand = "0.10"
hex = "0.4"
sha2 = "0.11"
subtle = "2"
aes = "0.9"
cbc = "0.2"
aes-gcm = "0.10"
pbkdf2 = { version = "0.13", default-features = false }
hmac = "0.13"
sha1 = "0.11"
md-5 = "0.11"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "mysql",
    "sqlite",
    "any",
    "migrate",
    "macros",
    "uuid",
    "chrono",
    "json",
] }

# CLI
clap = { version = "4", features = ["derive"] }

# IP matching
ipnetwork = "0.21"
local-ip-address = "0.6"

# TLS
axum-server = { version = "0.8", features = ["tls-rustls"] }
rcgen = "0.14"
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"

# OIDC
openidconnect = "4"
url = "2"
tower-cookies = "0.11"

# SSH key generation
ssh-key = { version = "0.6", features = ["ed25519"] }

# Rate limiting
tower_governor = "0.8"

# Base64 decoding (JWT payload for OIDC groups)
base64 = "0.23"

# HTTP client (Vault API)
reqwest = { version = "0.12", features = ["json", "rustls-tls-native-roots"], default-features = false }
webpki-roots = "1"

# SSH tunneling (jump host / bastion)
russh = "0.62"

# Docker (VDI container management)
bollard = "0.21"

# LUKS drive management (uid/gid for chown)
libc = "0.2"

# Socket-level options (TCP keepalive)
socket2 = "0.6"

# URL encoding/decoding (quick-connect redirect)
urlencoding = "2"
serde_urlencoded = "0.7"

# Unified error handling
thiserror = "2"

# Templates
minijinja = "1"

# Auth provider architecture
async-trait = "0.1"
bitflags = "2"

# SAML 2.0
quick-xml = "0.41"
ring = "0.17"
flate2 = "1"
ldap3 = { version = "0.12", default-features = false, features = ["sync", "tls-rustls-ring"] }

# TOTP MFA
totp-rs = { version = "5", features = ["otpauth", "qr", "gen_secret"] }

# Password hashing (Argon2id)
argon2 = "0.5"

[dev-dependencies]
proptest = "1"

[build-dependencies]
pulldown-cmark = "0.13"
regex = "1"
