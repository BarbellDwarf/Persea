# nginx configuration for persea
#
# Reverse-proxy template: HTTP -> HTTPS redirect with an ACME webroot,
# TLS termination with a Let's Encrypt certificate, WebSocket support for
# session streams. persea itself stays on the loopback interface.
#
# Setup:
#   1. Replace every example.com below with your real hostname.
#   2. Issue a certificate (see docs/reverse-proxies.md, "Let's Encrypt"):
#        sudo apt install certbot
#        sudo certbot certonly --webroot -w /var/www/html -d example.com
#   3. Install this file:
#        sudo install -m 0644 docs/examples/nginx.conf /etc/nginx/sites-available/persea
#        sudo ln -s /etc/nginx/sites-available/persea /etc/nginx/sites-enabled/persea
#        sudo nginx -t && sudo systemctl reload nginx
#
# persea config.toml must trust this proxy (client IPs and Secure cookies
# depend on it):
#   trusted_proxies = ["127.0.0.1/32"]
#
# The example proxies to https://127.0.0.1:8089 because persea serves
# HTTPS with its own loopback certificate (verification is skipped with
# proxy_ssl_verify off). If you run persea on plain HTTP, drop the [tls]
# section from its config, use "proxy_pass http://127.0.0.1:8089;" below,
# and remove the proxy_ssl_verify lines.

# HTTP: serve the ACME challenge, redirect everything else to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    # certbot --webroot -w /var/www/html writes challenges here. These
    # must stay on plain HTTP: never redirect them to HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: TLS termination and the proxy to persea.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com;

    # Paths match "certbot certonly" output (see the Let's Encrypt section
    # of docs/reverse-proxies.md). certbot replaces these files in place on
    # renewal, so a reload picks the new certificate up.
    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    # persea's loopback certificate is self-signed (or a copy of the public
    # one, which does not match the 127.0.0.1 hostname), so skip upstream
    # verification. Remove this only if you serve persea over a trusted
    # upstream certificate.
    proxy_ssl_verify off;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        # CRITICAL: no trailing slash or path on the upstream URL. A URI
        # component makes nginx decode %2F to / before forwarding, which
        # breaks nested folder paths in persea's connections tree (404 on
        # every subfolder). See docs/reverse-proxies.md, "the %2F gotcha".
        proxy_pass https://127.0.0.1:8089;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support for session streams.
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Long-lived WebSocket sessions; match persea's
        # session_max_duration_secs (default 8 h).
        proxy_read_timeout  8h;
        proxy_send_timeout  8h;
    }

    # Session streams run over /ws/{session_id}?token=... and can stay open
    # for hours; the upgrade headers and timeouts above must apply here too.
    location /ws/ {
        # No path component, same reason as above.
        proxy_pass https://127.0.0.1:8089;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout  8h;
        proxy_send_timeout  8h;
        proxy_buffering off;
    }
}
