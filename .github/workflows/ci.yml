name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
          rustflags: ""
      - run: cargo check

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
          rustflags: ""
      - run: cargo fmt --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
          rustflags: ""
      # Deliberate visibility lints (missing_docs, clippy::unwrap_used) in
      # lib.rs generate ~800 warnings; run clippy without -D warnings so the
      # warnings are visible but never fail the job.
      - run: cargo clippy

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
          rustflags: ""
      - run: cargo test

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
          rustflags: ""
      - run: cargo install cargo-audit && cargo audit

  # Integration test - starts server and runs health check
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
          rustflags: ""
      - run: cargo build
      - run: |
          # Start the server and poll /api/health until it is ready (the
          # fixed sleep raced slower runners — cold caches can take >5s).
          ./target/debug/persea --config /dev/null &
          SERVER_PID=$!
          READY=0
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8089/api/health >/dev/null 2>&1; then
              echo "server healthy after ${i}s"
              READY=1
              break
            fi
            sleep 1
          done
          kill $SERVER_PID 2>/dev/null
          [ "$READY" = "1" ] || { echo "server failed to become healthy" >&2; exit 1; }
