name: Docker

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  packages: write
  # type=gha cache needs the actions scope (write includes read); without it
  # the cache exporter aborts the whole build.
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase repo name
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          push: true
          tags: ghcr.io/${{ steps.repo.outputs.name }}:${{ github.sha }}
          cache-from: type=gha,scope=docker
          cache-to: type=gha,mode=max,scope=docker
