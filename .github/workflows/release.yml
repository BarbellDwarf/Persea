name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  # type=gha cache in the docker jobs needs the actions scope.
  actions: write

env:
  GUACD_REPO: https://github.com/persea-grove/persea-guacamole-server.git
  GUACD_COMMIT: d9218fe1

jobs:
  # ---------------------------------------------------------------------------
  # Build .deb package (Debian 13 / Trixie)
  # ---------------------------------------------------------------------------
  build-deb:
    name: Build .deb (amd64)
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            curl ca-certificates gcc g++ pkg-config make git \
            autoconf automake libtool \
            libcairo2-dev libjpeg-dev libpng-dev libwebp-dev \
            libssh2-1-dev libssl-dev libvncserver-dev \
            libpango1.0-dev libpulse-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev \
            libcunit1-dev libtelnet-dev libwebsockets-dev \
            uuid-dev freerdp3-dev \
            dpkg-dev debhelper fakeroot build-essential
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Restore guacd build cache
        uses: actions/cache@v6
        with:
          path: |
            /tmp/guacamole-server
            /tmp/guacd-build
          key: guacd-${{ runner.arch }}-${{ env.GUACD_COMMIT }}
      - name: Clone and build guacd
        run: |
          if [ ! -f /tmp/guacd-build/Makefile ]; then
            git clone --depth 1 --branch persea-1.6.1-freerdp3 $GUACD_REPO /tmp/guacamole-server
            git -C /tmp/guacamole-server checkout $GUACD_COMMIT 2>/dev/null || true
            cd /tmp/guacamole-server && autoreconf -fi
            mkdir /tmp/guacd-build && cd /tmp/guacd-build
            /tmp/guacamole-server/configure \
              --prefix=/opt/persea \
              --with-ssh --with-vnc --with-rdp \
              --without-telnet --without-kubernetes \
              --disable-guacenc --disable-guaclog --disable-static
          fi
          make -C /tmp/guacd-build -j"$(nproc)"
          make -C /tmp/guacd-build DESTDIR="$GITHUB_WORKSPACE/debian/staging" install
      - uses: Swatinem/rust-cache@v2
      - name: Build persea
        run: $HOME/.cargo/bin/cargo build --release
      - name: Build .deb
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          GIT_HASH=$(echo "$GITHUB_SHA" | cut -c1-7)
          DEB_VERSION="${VERSION}+g${GIT_HASH}"
          cat > debian/changelog <<EOF
          persea (${DEB_VERSION}) unstable; urgency=medium
            * Release ${GITHUB_REF_NAME}
           -- persea build <persea@localhost>  $(date -R)
          EOF
          dpkg-buildpackage -us -uc -b
          cp ../*.deb .
      - name: Upload .deb
        uses: actions/upload-artifact@v7
        with:
          name: deb-amd64
          path: "*.deb"
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Build .deb (ARM64)
  # ---------------------------------------------------------------------------
  build-deb-arm64:
    name: Build .deb (arm64)
    runs-on: ubuntu-24.04-arm
    container: debian:trixie
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            curl ca-certificates gcc g++ pkg-config make git \
            autoconf automake libtool \
            libcairo2-dev libjpeg-dev libpng-dev libwebp-dev \
            libssh2-1-dev libssl-dev libvncserver-dev \
            libpango1.0-dev libpulse-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev \
            libcunit1-dev libtelnet-dev libwebsockets-dev \
            uuid-dev freerdp3-dev \
            dpkg-dev debhelper fakeroot build-essential
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Restore guacd build cache
        uses: actions/cache@v6
        with:
          path: |
            /tmp/guacamole-server
            /tmp/guacd-build
          key: guacd-${{ runner.arch }}-${{ env.GUACD_COMMIT }}
      - name: Clone and build guacd
        run: |
          if [ ! -f /tmp/guacd-build/Makefile ]; then
            git clone --depth 1 --branch persea-1.6.1-freerdp3 $GUACD_REPO /tmp/guacamole-server
            git -C /tmp/guacamole-server checkout $GUACD_COMMIT 2>/dev/null || true
            cd /tmp/guacamole-server && autoreconf -fi
            mkdir /tmp/guacd-build && cd /tmp/guacd-build
            /tmp/guacamole-server/configure \
              --prefix=/opt/persea \
              --with-ssh --with-vnc --with-rdp \
              --without-telnet --without-kubernetes \
              --disable-guacenc --disable-guaclog --disable-static
          fi
          make -C /tmp/guacd-build -j"$(nproc)"
          make -C /tmp/guacd-build DESTDIR="$GITHUB_WORKSPACE/debian/staging" install
      - uses: Swatinem/rust-cache@v2
      - name: Build persea
        run: $HOME/.cargo/bin/cargo build --release
      - name: Build .deb
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          GIT_HASH=$(echo "$GITHUB_SHA" | cut -c1-7)
          DEB_VERSION="${VERSION}+g${GIT_HASH}"
          cat > debian/changelog <<EOF
          persea (${DEB_VERSION}) unstable; urgency=medium
            * Release ${GITHUB_REF_NAME}
           -- persea build <persea@localhost>  $(date -R)
          EOF
          dpkg-buildpackage -us -uc -b
          cp ../*.deb .
      - name: Upload .deb
        uses: actions/upload-artifact@v7
        with:
          name: deb-arm64
          path: "*.deb"
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Build .rpm (RHEL 10 / EL 10) — native rpmbuild in an ubi10 container
  # ---------------------------------------------------------------------------
  build-rpm:
    name: Build .rpm (el10)
    runs-on: ubuntu-latest
    container: registry.access.redhat.com/ubi10/ubi
    steps:
      - uses: actions/checkout@v7
      - name: Enable EPEL 10 and CodeReady Builder
        run: |
          dnf -y install dnf-plugins-core
          dnf config-manager --set-enabled "codeready-builder-for-ubi-10-$(uname -m)-rpms"
          # UBI ships a curated package subset; add CentOS Stream 10 for the
          # full AppStream/CRB (freerdp3 dev headers, pango-devel, CUnit).
          dnf config-manager --add-repo "https://mirror.stream.centos.org/10-stream/BaseOS/$(uname -m)/os/"
          dnf config-manager --add-repo "https://mirror.stream.centos.org/10-stream/AppStream/$(uname -m)/os/"
          dnf config-manager --add-repo "https://mirror.stream.centos.org/10-stream/CRB/$(uname -m)/os/"
          # Bootstrap the CentOS Stream 10 signing keys (single HTTPS-verified
          # package; the www.centos.org key file is rejected by RHEL 10 rpm
          # for its SHA-1 self-signature).
          dnf -y install --nogpgcheck centos-gpg-keys
          rpm --import /etc/pki/rpm-gpg/RPM-GPG-KEY-centosofficial-SHA256
          dnf -y install https://dl.fedoraproject.org/pub/epel/epel-release-latest-10.noarch.rpm
      - name: Install build dependencies
        run: |
          dnf -y install --setopt=install_weak_deps=False \
            cargo rust gcc gcc-c++ make autoconf automake libtool \
            pkgconf-pkg-config git \
            cairo-devel libjpeg-turbo-devel libpng-devel libwebp-devel \
            libssh2-devel openssl-devel pango-devel pulseaudio-libs-devel \
            libuuid-devel freerdp-devel CUnit-devel \
            libvncserver-devel libtelnet-devel libwebsockets-devel \
            ffmpeg-free-devel \
            selinux-policy-devel checkpolicy \
            rpm-build systemd-rpm-macros
      - name: Create source tarball
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          # UBI10 has no git, so checkout lands via the REST tarball (no .git);
          # tar the workspace instead of git archive. Output goes to /tmp so
          # the archive never contains itself.
          tar -czf "/tmp/persea-${VERSION}.tar.gz" --transform "s,^\./,persea-${VERSION}/," \
            --exclude="./target" -C "$GITHUB_WORKSPACE" .
          mkdir -p "$HOME/rpmbuild"/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          cp "/tmp/persea-${VERSION}.tar.gz" "$HOME/rpmbuild/SOURCES/"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
      - name: Build RPM
        run: |
          rpmbuild -bb \
            --define "_topdir $HOME/rpmbuild" \
            --define "persea_version $VERSION" \
            rpm/persea.spec
      - name: Upload RPM
        run: |
          # The runner's upload step cannot see $HOME/rpmbuild (container
          # path /github/home); stage the RPM into the shared workspace.
          mkdir -p "$GITHUB_WORKSPACE/rpm-artifacts"
          cp "$HOME/rpmbuild"/RPMS/*/*.rpm "$GITHUB_WORKSPACE/rpm-artifacts/"
      - name: Upload RPM
        uses: actions/upload-artifact@v7
        with:
          name: rpm-el10
          path: "rpm-artifacts/**/*.rpm"
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Smoke test the RPM: install into an ubi10-init container with systemd,
  # start persea, and hit the health endpoint over the bootstrapped cert.
  # ---------------------------------------------------------------------------
  smoke-rpm:
    name: Smoke test RPM (el10)
    runs-on: ubuntu-latest
    needs: [build-rpm]
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: rpm-el10
          path: artifacts
      - name: Install RPM and start services
        run: |
          docker run -d --name persea-smoke --privileged --cgroupns=host \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
            -v "$PWD/artifacts:/artifacts:ro" \
            registry.access.redhat.com/ubi10/ubi-init
          for i in $(seq 1 60); do
            docker exec persea-smoke systemctl is-system-running >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec persea-smoke bash -c '
            set -e
            dnf -q -y install dnf-plugins-core
            dnf -q config-manager --set-enabled "codeready-builder-for-ubi-10-$(uname -m)-rpms"
            dnf -q config-manager --add-repo "https://mirror.stream.centos.org/10-stream/BaseOS/$(uname -m)/os/"
            dnf -q config-manager --add-repo "https://mirror.stream.centos.org/10-stream/AppStream/$(uname -m)/os/"
            dnf -q config-manager --add-repo "https://mirror.stream.centos.org/10-stream/CRB/$(uname -m)/os/"
            dnf -q -y install --nogpgcheck centos-gpg-keys
            rpm --import /etc/pki/rpm-gpg/RPM-GPG-KEY-centosofficial-SHA256
            dnf -q -y install https://dl.fedoraproject.org/pub/epel/epel-release-latest-10.noarch.rpm
            dnf -q -y install --setopt=install_weak_deps=False /artifacts/*.rpm
          '
          docker exec persea-smoke bash -c '
            set -e
            # %post must have bootstrapped a cert and disabled Secure cookies
            test -f /opt/persea/tls/cert.pem
            test -f /opt/persea/tls/key.pem
            grep -q "secure_cookies = false" /opt/persea/config.toml
            systemctl start persea
            for i in $(seq 1 30); do
              if curl -ksf https://localhost/api/health; then exit 0; fi
              sleep 2
            done
            echo "persea failed to become healthy" >&2
            systemctl status persea --no-pager || true
            journalctl -u persea --no-pager | tail -40 || true
            exit 1
          '

  # ---------------------------------------------------------------------------
  # Build Windows binary (x86_64-pc-windows-msvc) via cargo-xwin on a Linux
  # runner, then the NSIS installer (unsigned).
  # ---------------------------------------------------------------------------
  build-windows:
    name: Build Windows installer (x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust and Windows target
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup target add x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-xwin, cross C toolchain, and makensis
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld llvm nsis
          cargo install cargo-xwin --locked
      - name: Extract version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Cross-compile persea (windows-msvc)
        # debuginfo=1 makes lld-link emit persea.pdb alongside the .exe.
        env:
          RUSTFLAGS: "-C debuginfo=1"
        run: cargo xwin build --release --target x86_64-pc-windows-msvc
      - name: Build NSIS installer
        run: |
          mkdir -p installers/windows/build
          cp target/x86_64-pc-windows-msvc/release/persea.exe installers/windows/build/
          cp -r static installers/windows/build/static
          cp README.md LICENSE config.example.toml installers/windows/build/
          cd installers/windows
          makensis -DVERSION="$VERSION" -DPROJECT_ROOT="$PWD/build" persea.nsi
          cd "$GITHUB_WORKSPACE"
          mkdir -p dist
          cp installers/windows/persea-setup.exe dist/
          cp target/x86_64-pc-windows-msvc/release/persea.exe dist/
          cp target/x86_64-pc-windows-msvc/release/persea.pdb dist/
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: dist/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Smoke test the Windows installer: silent install, service start, healthz.
  # ---------------------------------------------------------------------------
  smoke-windows:
    name: Smoke test Windows installer (x64)
    runs-on: windows-latest
    needs: [build-windows]
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: windows-x64
          path: artifacts
      - name: Install persea silently
        run: |
          $setup = Get-ChildItem artifacts -Filter persea-setup.exe | Select-Object -First 1
          if (-not $setup) { throw "installer not found in artifacts" }
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
      - name: Verify service and healthz
        run: |
          Start-Sleep -Seconds 5
          $svc = Get-Service -Name persea -ErrorAction Stop
          if ($svc.Status -ne 'Running') {
            throw "persea service is $($svc.Status), expected Running"
          }
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            try {
              $r = Invoke-WebRequest -Uri 'https://127.0.0.1:8089/api/health' `
                -SkipCertificateCheck -UseBasicParsing -TimeoutSec 5
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch {
              Start-Sleep -Seconds 2
            }
          }
          if (-not $ok) { throw "persea /api/health never returned 200" }
          Write-Output "smoke OK: service running, /api/health 200"

  # ---------------------------------------------------------------------------
  # Build .tar.gz + .zip packages (amd64)
  # ---------------------------------------------------------------------------
  build-tarball:
    name: Build packages (amd64)
    runs-on: ubuntu-latest
    needs: [build-deb]
    steps:
      - uses: actions/checkout@v7
      - name: Download .deb artifact
        uses: actions/download-artifact@v8
        with:
          name: deb-amd64
          path: artifacts/deb
      - name: Build tarball
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          TAG="${GITHUB_REF_NAME#v}"
          DIR="/tmp/persea-${TAG}-linux-amd64"
          mkdir -p "$DIR/bin" "$DIR/sbin" "$DIR/lib/freerdp3" "$DIR/static" "$DIR/systemd" "$DIR/docs" "$DIR/scripts"
          # Extract the binaries from the .deb: persea, guacd, its
          # libraries, the FreeRDP 3 plugins (RDPDR/RDPSND channels), and
          # the drive setup helper. install-release.sh installs them to
          # /opt/persea and bootstraps the storage key.
          dpkg-deb -x artifacts/deb/*.deb /tmp/deb-root
          cp /tmp/deb-root/opt/persea/bin/persea "$DIR/bin/"
          cp /tmp/deb-root/opt/persea/sbin/guacd "$DIR/sbin/"
          cp -a /tmp/deb-root/opt/persea/lib/*.so* "$DIR/lib/"
          cp -a /tmp/deb-root/usr/lib/*/freerdp3/*.so* "$DIR/lib/freerdp3/" 2>/dev/null || true
          cp /tmp/deb-root/opt/persea/bin/drive-setup.sh "$DIR/scripts/" 2>/dev/null || true
          cp install-release.sh "$DIR/"
          cp -r static/* "$DIR/static/"
          cp -r docs/*.md "$DIR/docs/" 2>/dev/null || true
          cp debian/config.toml.default "$DIR/config.toml.default" 2>/dev/null || true
          cp debian/persea.service "$DIR/systemd/" 2>/dev/null || true
          cp debian/persea-guacd.service "$DIR/systemd/" 2>/dev/null || true
          cp README.md "$DIR/"
          cp LICENSE "$DIR/"
          cd /tmp && tar czf "$GITHUB_WORKSPACE/persea-${TAG}-linux-amd64.tar.gz" "persea-${TAG}-linux-amd64"
      - name: Build zip
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          cd /tmp && zip -r "$GITHUB_WORKSPACE/persea-${TAG}-linux-amd64.zip" "persea-${TAG}-linux-amd64"
      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages-amd64
          path: |
            persea-*-linux-amd64.tar.gz
            persea-*-linux-amd64.zip
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Build .tar.gz + .zip packages (arm64)
  # ---------------------------------------------------------------------------
  build-tarball-arm64:
    name: Build packages (arm64)
    runs-on: ubuntu-24.04-arm
    needs: [build-deb-arm64]
    steps:
      - uses: actions/checkout@v7
      - name: Download .deb artifact
        uses: actions/download-artifact@v8
        with:
          name: deb-arm64
          path: artifacts/deb
      - name: Build tarball
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          DIR="/tmp/persea-${TAG}-linux-arm64"
          mkdir -p "$DIR/bin" "$DIR/sbin" "$DIR/lib/freerdp3" "$DIR/static" "$DIR/systemd" "$DIR/docs" "$DIR/scripts"
          # Extract the binaries from the .deb: persea, guacd, its
          # libraries, the FreeRDP 3 plugins (RDPDR/RDPSND channels), and
          # the drive setup helper. install-release.sh installs them to
          # /opt/persea and bootstraps the storage key.
          dpkg-deb -x artifacts/deb/*.deb /tmp/deb-root
          cp /tmp/deb-root/opt/persea/bin/persea "$DIR/bin/"
          cp /tmp/deb-root/opt/persea/sbin/guacd "$DIR/sbin/"
          cp -a /tmp/deb-root/opt/persea/lib/*.so* "$DIR/lib/"
          cp -a /tmp/deb-root/usr/lib/*/freerdp3/*.so* "$DIR/lib/freerdp3/" 2>/dev/null || true
          cp /tmp/deb-root/opt/persea/bin/drive-setup.sh "$DIR/scripts/" 2>/dev/null || true
          cp install-release.sh "$DIR/"
          cp -r static/* "$DIR/static/"
          cp -r docs/*.md "$DIR/docs/" 2>/dev/null || true
          cp debian/config.toml.default "$DIR/config.toml.default" 2>/dev/null || true
          cp debian/persea.service "$DIR/systemd/" 2>/dev/null || true
          cp debian/persea-guacd.service "$DIR/systemd/" 2>/dev/null || true
          cp README.md "$DIR/"
          cp LICENSE "$DIR/"
          cd /tmp && tar czf "$GITHUB_WORKSPACE/persea-${TAG}-linux-arm64.tar.gz" "persea-${TAG}-linux-arm64"
      - name: Build zip
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          cd /tmp && zip -r "$GITHUB_WORKSPACE/persea-${TAG}-linux-arm64.zip" "persea-${TAG}-linux-arm64"
      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages-arm64
          path: |
            persea-*-linux-arm64.tar.gz
            persea-*-linux-arm64.zip
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Build and push Docker images to GHCR
  # ---------------------------------------------------------------------------
  build-docker-amd64:
    name: Build Docker (amd64)
    runs-on: ubuntu-latest
    needs: [build-tarball]
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract version and lowercase repo
        id: version
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - name: Build and push amd64
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ steps.version.outputs.repo }}:${{ steps.version.outputs.version }}-amd64
          cache-from: type=gha,scope=docker-amd64
          cache-to: type=gha,mode=max,scope=docker-amd64

  build-docker-arm64:
    name: Build Docker (arm64)
    runs-on: ubuntu-24.04-arm
    needs: [build-tarball-arm64]
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract version and lowercase repo
        id: version
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - name: Build and push arm64
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ steps.version.outputs.repo }}:${{ steps.version.outputs.version }}-arm64
          cache-from: type=gha,scope=docker-arm64
          cache-to: type=gha,mode=max,scope=docker-arm64

  # ---------------------------------------------------------------------------
  # Publish multi-arch Docker manifest
  # ---------------------------------------------------------------------------
  build-docker-manifest:
    name: Publish Docker manifest
    needs: [build-docker-amd64, build-docker-arm64]
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract version and lowercase repo
        id: version
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - name: Create and push multi-arch manifests
        run: |
          VER="${{ steps.version.outputs.version }}"
          REPO="${{ steps.version.outputs.repo }}"
          docker buildx imagetools create \
            -t "ghcr.io/${REPO}:${VER}" \
            -t "ghcr.io/${REPO}:latest" \
            "ghcr.io/${REPO}:${VER}-amd64" \
            "ghcr.io/${REPO}:${VER}-arm64"

  # ---------------------------------------------------------------------------
  # Create GitHub Release with all packages
  # ---------------------------------------------------------------------------
  release:
    name: Create Release
    needs: [build-deb, build-deb-arm64, build-rpm, smoke-rpm, build-windows, smoke-windows, build-tarball, build-tarball-arm64, build-docker-manifest]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download .deb (amd64)
        uses: actions/download-artifact@v8
        with:
          name: deb-amd64
          path: artifacts/deb-amd64
      - name: Download .deb (arm64)
        uses: actions/download-artifact@v8
        with:
          name: deb-arm64
          path: artifacts/deb-arm64
      - name: Download .rpm (el10)
        uses: actions/download-artifact@v8
        with:
          name: rpm-el10
          path: artifacts/rpm-el10
      - name: Download Windows (x64)
        uses: actions/download-artifact@v8
        with:
          name: windows-x64
          path: artifacts/windows-x64
      - name: Download packages (amd64)
        uses: actions/download-artifact@v8
        with:
          name: packages-amd64
          path: artifacts/packages-amd64
      - name: Download packages (arm64)
        uses: actions/download-artifact@v8
        with:
          name: packages-arm64
          path: artifacts/packages-arm64
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            artifacts/deb-amd64/*.deb
            artifacts/deb-arm64/*.deb
            artifacts/rpm-el10/*.rpm
            artifacts/windows-x64/persea-setup.exe
            artifacts/windows-x64/persea.exe
            artifacts/windows-x64/persea.pdb
            artifacts/packages-amd64/*.tar.gz
            artifacts/packages-amd64/*.zip
            artifacts/packages-arm64/*.tar.gz
            artifacts/packages-arm64/*.zip
