name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  # type=gha cache in the docker jobs needs the actions scope.
  actions: write

env:
  GUACD_REPO: https://github.com/apache/guacamole-server.git
  GUACD_COMMIT: de97609007c088b5e6afd827eff5e9076013a247

jobs:
  # ---------------------------------------------------------------------------
  # Build .deb package (Debian 13 / Trixie)
  # ---------------------------------------------------------------------------
  build-deb:
    name: Build .deb (amd64)
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            curl ca-certificates gcc g++ pkg-config make git \
            autoconf automake libtool \
            libcairo2-dev libjpeg-dev libpng-dev libwebp-dev \
            libssh2-1-dev libssl-dev libvncserver-dev \
            libpango1.0-dev libpulse-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev \
            libcunit1-dev libtelnet-dev libwebsockets-dev \
            uuid-dev freerdp3-dev \
            dpkg-dev debhelper fakeroot build-essential
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Restore guacd build cache
        uses: actions/cache@v4
        with:
          path: |
            /tmp/guacamole-server
            /tmp/guacd-build
          key: guacd-${{ runner.arch }}-${{ env.GUACD_COMMIT }}-${{ hashFiles('patches/*.patch') }}
      - name: Clone and build guacd
        run: |
          if [ ! -f /tmp/guacd-build/Makefile ]; then
            git clone $GUACD_REPO /tmp/guacamole-server && git -C /tmp/guacamole-server checkout $GUACD_COMMIT
            for patch in patches/*.patch; do
              [ -f "$patch" ] || continue
              git -C /tmp/guacamole-server apply "$GITHUB_WORKSPACE/$patch"
            done
            cd /tmp/guacamole-server && autoreconf -fi
            mkdir /tmp/guacd-build && cd /tmp/guacd-build
            /tmp/guacamole-server/configure \
              --prefix=/opt/persea \
              --with-ssh --with-vnc --with-rdp \
              --without-telnet --without-kubernetes \
              --disable-guacenc --disable-guaclog --disable-static
          fi
          make -C /tmp/guacd-build -j"$(nproc)"
          make -C /tmp/guacd-build DESTDIR="$GITHUB_WORKSPACE/debian/staging" install
      - uses: Swatinem/rust-cache@v2
      - name: Build persea
        run: $HOME/.cargo/bin/cargo build --release
      - name: Build .deb
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          GIT_HASH=$(echo "$GITHUB_SHA" | cut -c1-7)
          DEB_VERSION="${VERSION}+g${GIT_HASH}"
          cat > debian/changelog <<EOF
          persea (${DEB_VERSION}) unstable; urgency=medium
            * Release ${GITHUB_REF_NAME}
           -- persea build <persea@localhost>  $(date -R)
          EOF
          dpkg-buildpackage -us -uc -b
          cp ../*.deb .
      - name: Upload .deb
        uses: actions/upload-artifact@v7
        with:
          name: deb-amd64
          path: "*.deb"
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Build .deb (ARM64)
  # ---------------------------------------------------------------------------
  build-deb-arm64:
    name: Build .deb (arm64)
    runs-on: ubuntu-24.04-arm
    container: debian:trixie
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            curl ca-certificates gcc g++ pkg-config make git \
            autoconf automake libtool \
            libcairo2-dev libjpeg-dev libpng-dev libwebp-dev \
            libssh2-1-dev libssl-dev libvncserver-dev \
            libpango1.0-dev libpulse-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev \
            libcunit1-dev libtelnet-dev libwebsockets-dev \
            uuid-dev freerdp3-dev \
            dpkg-dev debhelper fakeroot build-essential
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Restore guacd build cache
        uses: actions/cache@v4
        with:
          path: |
            /tmp/guacamole-server
            /tmp/guacd-build
          key: guacd-${{ runner.arch }}-${{ env.GUACD_COMMIT }}-${{ hashFiles('patches/*.patch') }}
      - name: Clone and build guacd
        run: |
          if [ ! -f /tmp/guacd-build/Makefile ]; then
            git clone $GUACD_REPO /tmp/guacamole-server && git -C /tmp/guacamole-server checkout $GUACD_COMMIT
            for patch in patches/*.patch; do
              [ -f "$patch" ] || continue
              git -C /tmp/guacamole-server apply "$GITHUB_WORKSPACE/$patch"
            done
            cd /tmp/guacamole-server && autoreconf -fi
            mkdir /tmp/guacd-build && cd /tmp/guacd-build
            /tmp/guacamole-server/configure \
              --prefix=/opt/persea \
              --with-ssh --with-vnc --with-rdp \
              --without-telnet --without-kubernetes \
              --disable-guacenc --disable-guaclog --disable-static
          fi
          make -C /tmp/guacd-build -j"$(nproc)"
          make -C /tmp/guacd-build DESTDIR="$GITHUB_WORKSPACE/debian/staging" install
      - uses: Swatinem/rust-cache@v2
      - name: Build persea
        run: $HOME/.cargo/bin/cargo build --release
      - name: Build .deb
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          GIT_HASH=$(echo "$GITHUB_SHA" | cut -c1-7)
          DEB_VERSION="${VERSION}+g${GIT_HASH}"
          cat > debian/changelog <<EOF
          persea (${DEB_VERSION}) unstable; urgency=medium
            * Release ${GITHUB_REF_NAME}
           -- persea build <persea@localhost>  $(date -R)
          EOF
          dpkg-buildpackage -us -uc -b
          cp ../*.deb .
      - name: Upload .deb
        uses: actions/upload-artifact@v7
        with:
          name: deb-arm64
          path: "*.deb"
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Build .tar.gz + .zip packages (amd64)
  # ---------------------------------------------------------------------------
  build-tarball:
    name: Build packages (amd64)
    runs-on: ubuntu-latest
    needs: [build-deb]
    steps:
      - uses: actions/checkout@v7
      - name: Download .deb artifact
        uses: actions/download-artifact@v8
        with:
          name: deb-amd64
          path: artifacts/deb
      - name: Build tarball
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          TAG="${GITHUB_REF_NAME#v}"
          DIR="/tmp/persea-${TAG}-linux-amd64"
          mkdir -p "$DIR/bin" "$DIR/sbin" "$DIR/lib" "$DIR/static" "$DIR/systemd" "$DIR/docs"
          cp target/release/persea "$DIR/bin/" 2>/dev/null || cp artifacts/deb/*.deb /tmp/
          cp -r static/* "$DIR/static/"
          cp -r docs/*.md "$DIR/docs/" 2>/dev/null || true
          cp debian/config.toml.default "$DIR/config.toml.default" 2>/dev/null || true
          cp debian/persea.service "$DIR/systemd/" 2>/dev/null || true
          cp debian/persea-guacd.service "$DIR/systemd/" 2>/dev/null || true
          cp README.md "$DIR/"
          cp LICENSE "$DIR/"
          cd /tmp && tar czf "$GITHUB_WORKSPACE/persea-${TAG}-linux-amd64.tar.gz" "persea-${TAG}-linux-amd64"
      - name: Build zip
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          cd /tmp && zip -r "$GITHUB_WORKSPACE/persea-${TAG}-linux-amd64.zip" "persea-${TAG}-linux-amd64"
      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages-amd64
          path: |
            persea-*-linux-amd64.tar.gz
            persea-*-linux-amd64.zip
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Build .tar.gz + .zip packages (arm64)
  # ---------------------------------------------------------------------------
  build-tarball-arm64:
    name: Build packages (arm64)
    runs-on: ubuntu-24.04-arm
    needs: [build-deb-arm64]
    steps:
      - uses: actions/checkout@v7
      - name: Download .deb artifact
        uses: actions/download-artifact@v8
        with:
          name: deb-arm64
          path: artifacts/deb
      - name: Build tarball
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          DIR="/tmp/persea-${TAG}-linux-arm64"
          mkdir -p "$DIR/bin" "$DIR/sbin" "$DIR/lib" "$DIR/static" "$DIR/systemd" "$DIR/docs"
          cp target/release/persea "$DIR/bin/" 2>/dev/null || cp artifacts/deb/*.deb /tmp/
          cp -r static/* "$DIR/static/"
          cp -r docs/*.md "$DIR/docs/" 2>/dev/null || true
          cp debian/config.toml.default "$DIR/config.toml.default" 2>/dev/null || true
          cp debian/persea.service "$DIR/systemd/" 2>/dev/null || true
          cp debian/persea-guacd.service "$DIR/systemd/" 2>/dev/null || true
          cp README.md "$DIR/"
          cp LICENSE "$DIR/"
          cd /tmp && tar czf "$GITHUB_WORKSPACE/persea-${TAG}-linux-arm64.tar.gz" "persea-${TAG}-linux-arm64"
      - name: Build zip
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          cd /tmp && zip -r "$GITHUB_WORKSPACE/persea-${TAG}-linux-arm64.zip" "persea-${TAG}-linux-arm64"
      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages-arm64
          path: |
            persea-*-linux-arm64.tar.gz
            persea-*-linux-arm64.zip
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Build and push Docker images to GHCR
  # ---------------------------------------------------------------------------
  build-docker-amd64:
    name: Build Docker (amd64)
    runs-on: ubuntu-latest
    needs: [build-tarball]
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract version and lowercase repo
        id: version
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - name: Build and push amd64
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ steps.version.outputs.repo }}:${{ steps.version.outputs.version }}-amd64
          cache-from: type=gha,scope=docker-amd64
          cache-to: type=gha,mode=max,scope=docker-amd64

  build-docker-arm64:
    name: Build Docker (arm64)
    runs-on: ubuntu-24.04-arm
    needs: [build-tarball-arm64]
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract version and lowercase repo
        id: version
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - name: Build and push arm64
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ steps.version.outputs.repo }}:${{ steps.version.outputs.version }}-arm64
          cache-from: type=gha,scope=docker-arm64
          cache-to: type=gha,mode=max,scope=docker-arm64

  # ---------------------------------------------------------------------------
  # Publish multi-arch Docker manifest
  # ---------------------------------------------------------------------------
  build-docker-manifest:
    name: Publish Docker manifest
    needs: [build-docker-amd64, build-docker-arm64]
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract version and lowercase repo
        id: version
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - name: Create and push multi-arch manifests
        run: |
          VER="${{ steps.version.outputs.version }}"
          REPO="${{ steps.version.outputs.repo }}"
          docker buildx imagetools create \
            -t "ghcr.io/${REPO}:${VER}" \
            -t "ghcr.io/${REPO}:latest" \
            "ghcr.io/${REPO}:${VER}-amd64" \
            "ghcr.io/${REPO}:${VER}-arm64"

  # ---------------------------------------------------------------------------
  # Create GitHub Release with all packages
  # ---------------------------------------------------------------------------
  release:
    name: Create Release
    needs: [build-deb, build-deb-arm64, build-tarball, build-tarball-arm64, build-docker-manifest]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download .deb (amd64)
        uses: actions/download-artifact@v8
        with:
          name: deb-amd64
          path: artifacts/deb-amd64
      - name: Download .deb (arm64)
        uses: actions/download-artifact@v8
        with:
          name: deb-arm64
          path: artifacts/deb-arm64
      - name: Download packages (amd64)
        uses: actions/download-artifact@v8
        with:
          name: packages-amd64
          path: artifacts/packages-amd64
      - name: Download packages (arm64)
        uses: actions/download-artifact@v8
        with:
          name: packages-arm64
          path: artifacts/packages-arm64
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            artifacts/deb-amd64/*.deb
            artifacts/deb-arm64/*.deb
            artifacts/packages-amd64/*.tar.gz
            artifacts/packages-amd64/*.zip
            artifacts/packages-arm64/*.tar.gz
            artifacts/packages-arm64/*.zip
